<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Unfinished Promise — Live</title>
<style>
  :root{ --bg:#efe6d2; --card:#fbf6ea; --ink:#2a2118; --ink-soft:#6b5f4c;
    --accent:#9a6b1f; --good:#2e7d32; --bad:#b23b2e; --border:#cdbf9f;
    --c1:#c0392b; --c2:#1f6fb2; --c3:#b8860b; --c4:#2e7d32; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:Georgia,"Times New Roman",serif;color:var(--ink);
    background:#e3d7bd;background-image:radial-gradient(rgba(80,60,30,.08) .7px,transparent 1.1px);background-size:5px 5px;
    min-height:100vh;}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px;}
  h1{font-size:clamp(1.5rem,5vw,2.2rem);margin:.2em 0;}
  h2{font-size:clamp(1.2rem,4vw,1.6rem);margin:.3em 0;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.08);}
  .muted{color:var(--ink-soft);}
  .eyebrow{letter-spacing:.2em;text-transform:uppercase;font-size:.72rem;color:var(--accent);}
  .btn{display:inline-block;font:inherit;font-size:1rem;cursor:pointer;border:1px solid var(--accent);
    background:var(--accent);color:#fff;border-radius:10px;padding:11px 18px;margin:4px 0;}
  .btn.secondary{background:transparent;color:var(--accent);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.big{display:block;width:100%;font-size:1.15rem;padding:16px;}
  input{font:inherit;font-size:1.05rem;padding:11px;border:1px solid var(--border);border-radius:10px;width:100%;}
  .code{font-size:clamp(2.4rem,12vw,4rem);font-weight:800;letter-spacing:.18em;text-align:center;color:var(--accent);margin:.1em 0;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;}
  @media(max-width:520px){.opts{grid-template-columns:1fr;}}
  .opt{font:inherit;font-size:1.05rem;text-align:left;cursor:pointer;color:#fff;border:none;border-radius:12px;padding:16px;min-height:64px;line-height:1.25;}
  .opt:disabled{cursor:default;}
  .opt.o0{background:var(--c1);} .opt.o1{background:var(--c2);} .opt.o2{background:var(--c3);} .opt.o3{background:var(--c4);}
  .opt.dim{opacity:.4;} .opt.right{outline:4px solid #163;box-shadow:0 0 0 4px #2e7d3255;}
  .players{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
  .chip{background:#efe3c8;border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:.95rem;}
  table{width:100%;border-collapse:collapse;}
  td,th{padding:8px 6px;border-bottom:1px solid var(--border);text-align:left;}
  td.sc{text-align:right;font-weight:800;white-space:nowrap;}
  .rank{font-weight:800;color:var(--accent);width:2.2em;}
  .win{font-size:1.3rem;font-weight:800;color:var(--good);}
  .big-num{font-size:2.4rem;font-weight:800;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .spacer{flex:1;}
  a{color:var(--accent);}
  code{background:#efe3c8;padding:2px 6px;border-radius:5px;font-family:"Courier New",monospace;}
  ol li{margin:.4em 0;}
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   FIREBASE SETUP  —  paste your project's web config below.
   1. console.firebase.google.com  ->  Add project (free).
   2. Build > Realtime Database  ->  Create Database  ->  Start in TEST MODE.
   3. Project settings (gear)  ->  "Your apps"  ->  Web (</>)  ->  register,
      then copy the firebaseConfig object and paste it over this one.
   4. Make sure databaseURL is included (it ends in .firebaseio.com).
   ============================================================ */
const FIREBASE_CONFIG = {https://console.firebase.google.com/project/unfinshed-project/database/unfinshed-project-default-rtdb/data/~2F
  apiKey: "PASTE_API_KEY",
  authDomain: "PASTE.firebaseapp.com",
  databaseURL: "https://PASTE-default-rtdb.firebaseio.com",
  projectId: "PASTE",
  appId: "PASTE"
};

/* ---- The rounds everyone plays (built from the game's content). ----
   type 'choice' options carry a stability value -> points reward
   choices that uphold equality. type 'quiz' options have correct:true. */
function cp(stab){ return Math.max(0, Math.round((stab+20)*25)); } // choice points
const QP = 1000; // quiz correct points
const ROUNDS = [
  { type:"choice", year:"1776", title:"The Declaration",
    prompt:"Jefferson's draft blames the King for the slave trade and calls it “cruel war against human nature itself.” The South demands the paragraph be cut. What do you push for?",
    options:[
      {text:"Keep the anti-slavery passage", points:cp(12)},
      {text:"Cut the passage to keep the union", points:cp(-8)},
      {text:"Water it down", points:cp(-6)}
    ],
    reveal:"Congress really cut it “in complaisance to South Carolina and Georgia.” Keeping it was the boldest move." },
  { type:"choice", year:"1787", title:"The Constitution",
    prompt:"The Convention is deciding whether to count enslaved people for representation and whether Congress can ban the slave trade. What do you back?",
    options:[
      {text:"Push to end slavery now", points:cp(12)},
      {text:"Accept the compromises", points:cp(-10)},
      {text:"Ban the trade, keep the rest", points:cp(-4)}
    ],
    reveal:"The Convention took the compromises: the three-fifths clause and the slave trade protected until 1808." },
  { type:"choice", year:"1868", title:"Equal Protection",
    prompt:"The 14th Amendment promises “the equal protection of the laws.” Enforcing it takes federal troops and years of Northern patience. What do you commit to?",
    options:[
      {text:"Ratify and enforce it", points:cp(14)},
      {text:"Ratify, but leave it to the states", points:cp(-6)},
      {text:"Restore the old order", points:cp(-20)}
    ],
    reveal:"In reality the troops left in 1877, and poll taxes, literacy tests, and Jim Crow followed." },
  { type:"choice", year:"1896", title:"Plessy v. Ferguson",
    prompt:"The Supreme Court must decide whether “separate but equal” is constitutional. How should it rule?",
    options:[
      {text:"Reject “separate but equal”", points:cp(12)},
      {text:"Uphold “separate but equal”", points:cp(-14)},
      {text:"Dodge the question", points:cp(-6)}
    ],
    reveal:"The Court upheld it 7–1. Only Harlan dissented: “our constitution is color-blind.”" },
  { type:"choice", year:"1954", title:"Brown v. Board",
    prompt:"Linda Brown's case reaches the Court: can separate schools ever be equal? What should the Court rule?",
    options:[
      {text:"Strike down segregation", points:cp(16)},
      {text:"Uphold Plessy", points:cp(-18)},
      {text:"Order it “gradually”", points:cp(-4)}
    ],
    reveal:"A unanimous Court struck it down: “separate educational facilities are inherently unequal.”" },
  { type:"quiz", title:"Quiz",
    prompt:"What does the Declaration of Independence say about people?",
    options:[
      {text:"That all men are created equal, with certain unalienable rights", correct:true, points:QP},
      {text:"That only landowners have rights", points:0},
      {text:"That the king decides who is equal", points:0},
      {text:"That equality is granted by Congress", points:0}
    ] },
  { type:"quiz", title:"Quiz",
    prompt:"What was the founding-era contradiction with “all men are created equal”?",
    options:[
      {text:"The nation proclaimed equality while slavery continued and many were excluded", correct:true, points:QP},
      {text:"The colonies had no written laws", points:0},
      {text:"Only the Supreme Court could define equality", points:0},
      {text:"There were no elections at all", points:0}
    ] },
  { type:"quiz", title:"Quiz",
    prompt:"Which 1954 Supreme Court case struck down “separate but equal”?",
    options:[
      {text:"Brown v. Board of Education", correct:true, points:QP},
      {text:"Plessy v. Ferguson", points:0},
      {text:"Dred Scott v. Sandford", points:0},
      {text:"Korematsu v. United States", points:0}
    ] }
];

/* ---------------------- helpers ---------------------- */
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const configured = !JSON.stringify(FIREBASE_CONFIG).includes("PASTE");
const qs = new URLSearchParams(location.search);
let db=null;
if(configured){ try{ firebase.initializeApp(FIREBASE_CONFIG); db=firebase.database(); }catch(e){ console.error(e); } }

function randCode(){ const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<4;i++) s+=a[Math.floor(Math.random()*a.length)]; return s; }
function joinUrl(code){ return location.origin+location.pathname+"?join="+code; }
function scoresFromAnswers(answers){ // answers: {round:{pid:opt}} -> {pid:total}
  const out={};
  if(!answers) return out;
  Object.keys(answers).forEach(r=>{ const R=ROUNDS[+r]; if(!R) return;
    Object.keys(answers[r]).forEach(pid=>{ const opt=answers[r][pid];
      const pts=(R.options[opt]&&R.options[opt].points)||0; out[pid]=(out[pid]||0)+pts; }); });
  return out;
}
function leaderboard(room){
  const sc=scoresFromAnswers(room.answers||{});
  const players=room.players||{};
  return Object.keys(players).map(pid=>({pid,name:players[pid].name,score:sc[pid]||0}))
    .sort((a,b)=> b.score-a.score || a.name.localeCompare(b.name));
}

/* ---------------------- router ---------------------- */
function start(){
  if(!configured){ return renderSetup(); }
  if(qs.get('join')) return renderJoin(qs.get('join').toUpperCase());
  renderLanding();
}

function renderSetup(){
  app.innerHTML = `<div class="card">
    <div class="eyebrow">The Unfinished Promise · Live</div>
    <h1>One quick setup step</h1>
    <p>This multiplayer version needs a free <strong>Firebase</strong> project to sync everyone's devices. It takes about 5 minutes, once:</p>
    <ol>
      <li>Go to <a href="https://console.firebase.google.com" target="_blank" rel="noopener">console.firebase.google.com</a> and <strong>Add project</strong> (free Spark plan).</li>
      <li>In the left menu: <strong>Build &rarr; Realtime Database &rarr; Create Database &rarr; Start in test mode</strong>.</li>
      <li>Click the gear &rarr; <strong>Project settings &rarr; Your apps &rarr; Web (&lt;/&gt;)</strong>, register the app, and copy the <code>firebaseConfig</code> object.</li>
      <li>Paste it over the <code>FIREBASE_CONFIG</code> block near the top of <code>live.html</code> (make sure it includes <code>databaseURL</code>).</li>
    </ol>
    <p class="muted">Then reopen this page. (Your single-player / class-vote version at <code>index.html</code> works without any of this.)</p>
  </div>`;
}

function renderLanding(){
  app.innerHTML = `<div class="card" style="text-align:center;">
    <div class="eyebrow">The Unfinished Promise</div>
    <h1>Live Classroom Game</h1>
    <p class="muted">One person hosts on the big screen. Everyone else joins on their own phone.</p>
    <button class="btn big" data-act="host">Host a game</button>
    <button class="btn big secondary" data-act="gojoin">Join a game</button>
  </div>`;
  app.querySelector('[data-act="host"]').onclick = hostCreate;
  app.querySelector('[data-act="gojoin"]').onclick = ()=>renderJoin("");
}

/* ---------------------- HOST ---------------------- */
function hostCreate(){
  const code = randCode();
  const ref = db.ref('rooms/'+code);
  ref.set({ status:'lobby', round:-1, createdAt:firebase.database.ServerValue.TIMESTAMP })
     .then(()=> hostRoom(code))
     .catch(e=> app.innerHTML = `<div class="card"><h2>Could not create a room</h2><p class="muted">${esc(e.message)}</p><p>Check that Realtime Database is enabled and the config is correct.</p></div>`);
}
function hostRoom(code){
  const ref = db.ref('rooms/'+code);
  ref.on('value', snap=>{
    const room = snap.val(); if(!room) return;
    renderHost(code, room);
  });
}
function renderHost(code, room){
  if(room.status==='lobby'){
    const players = room.players? Object.values(room.players):[];
    app.innerHTML = `<div class="card" style="text-align:center;">
      <div class="eyebrow">Join at</div>
      <p style="font-size:1.05rem;margin:.2em 0;word-break:break-all;">${esc(joinUrl(code))}</p>
      <div class="eyebrow" style="margin-top:8px;">Game code</div>
      <div class="code">${esc(code)}</div>
      <img alt="QR to join" style="width:150px;height:150px;" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(joinUrl(code))}">
      <p class="muted">${players.length} joined</p>
      <div class="players">${players.map(p=>`<span class="chip">${esc(p.name)}</span>`).join('')||'<span class="muted">waiting for players…</span>'}</div>
      <button class="btn big" data-act="start" ${players.length? '':'disabled'}>Start game (${players.length})</button>
    </div>`;
    const b=app.querySelector('[data-act="start"]'); if(b) b.onclick=()=> db.ref('rooms/'+code).update({status:'playing', round:0, roundStartedAt:firebase.database.ServerValue.TIMESTAMP});
    return;
  }
  if(room.status==='done') return renderHostFinal(code, room);

  // playing or reveal
  const r = room.round|0, R = ROUNDS[r];
  const ans = (room.answers && room.answers[r]) || {};
  const nAns = Object.keys(ans).length;
  const nPlayers = room.players? Object.keys(room.players).length:0;
  const revealing = room.status==='reveal';
  const tally = R.options.map((_,oi)=> Object.values(ans).filter(o=>o===oi).length);
  app.innerHTML = `<div class="card">
    <div class="row"><span class="eyebrow">${R.year?esc(R.year)+' · ':''}${esc(R.title)} — Q${r+1} of ${ROUNDS.length}</span><span class="spacer"></span><span class="muted">${nAns}/${nPlayers} answered</span></div>
    <h2>${esc(R.prompt)}</h2>
    <div class="opts">
      ${R.options.map((o,oi)=>{
        const best = R.type==='quiz' ? o.correct : (o.points===Math.max(...R.options.map(x=>x.points)));
        const cls = 'opt o'+oi + (revealing? (best?' right':' dim'):'');
        return `<div class="${cls}">${esc(o.text)}${revealing?`<div style="font-size:.85rem;opacity:.9;margin-top:6px;">${tally[oi]} vote${tally[oi]===1?'':'s'}${o.points?` · ${o.points} pts`:''}</div>`:''}</div>`;
      }).join('')}
    </div>
    ${revealing?`<div class="card" style="background:#efe3c8;">${R.reveal?esc(R.reveal):'The best answer is highlighted.'}</div>${miniBoard(room)}`:''}
    <div class="row">
      ${revealing
        ? `<button class="btn big" data-act="next">${r+1<ROUNDS.length?'Next question &rarr;':'Final results &rarr;'}</button>`
        : `<button class="btn big" data-act="reveal">Reveal answer</button>`}
    </div>
  </div>`;
  const rv=app.querySelector('[data-act="reveal"]'); if(rv) rv.onclick=()=> db.ref('rooms/'+code).update({status:'reveal'});
  const nx=app.querySelector('[data-act="next"]'); if(nx) nx.onclick=()=>{
    if(r+1<ROUNDS.length) db.ref('rooms/'+code).update({status:'playing', round:r+1, roundStartedAt:firebase.database.ServerValue.TIMESTAMP});
    else db.ref('rooms/'+code).update({status:'done'});
  };
}
function miniBoard(room){
  const lb = leaderboard(room).slice(0,5);
  if(!lb.length) return '';
  return `<table>${lb.map((p,i)=>`<tr><td class="rank">${i+1}</td><td>${esc(p.name)}</td><td class="sc">${p.score}</td></tr>`).join('')}</table>`;
}
function renderHostFinal(code, room){
  const lb = leaderboard(room);
  const win = lb[0];
  app.innerHTML = `<div class="card" style="text-align:center;">
    <div class="eyebrow">Final results</div>
    ${win?`<p class="win">\u{1F3C6} ${esc(win.name)} wins!</p><p class="big-num">${win.score} pts</p>`:'<p class="muted">No players.</p>'}
    <table style="text-align:left;">${lb.map((p,i)=>`<tr><td class="rank">${i+1}</td><td>${esc(p.name)}</td><td class="sc">${p.score}</td></tr>`).join('')}</table>
    <button class="btn" data-act="again">New game</button>
  </div>`;
  const a=app.querySelector('[data-act="again"]'); if(a) a.onclick=()=>{ db.ref('rooms/'+code).remove().catch(()=>{}); renderLanding(); };
}

/* ---------------------- PLAYER ---------------------- */
function renderJoin(code){
  app.innerHTML = `<div class="card">
    <div class="eyebrow">The Unfinished Promise · Live</div>
    <h1>Join the game</h1>
    <p><input id="jc" placeholder="Game code" value="${esc(code)}" maxlength="4" style="text-transform:uppercase;letter-spacing:.2em;"></p>
    <p><input id="jn" placeholder="Your name" maxlength="18"></p>
    <button class="btn big" data-act="join">Join</button>
    <p id="jerr" class="muted"></p>
  </div>`;
  app.querySelector('[data-act="join"]').onclick = ()=>{
    const c=(document.getElementById('jc').value||'').trim().toUpperCase();
    const n=(document.getElementById('jn').value||'').trim();
    if(c.length!==4||!n){ document.getElementById('jerr').textContent="Enter a 4-letter code and your name."; return; }
    joinRoom(c,n);
  };
}
function joinRoom(code, name){
  const roomRef = db.ref('rooms/'+code);
  roomRef.child('status').get().then(s=>{
    if(!s.exists()){ document.getElementById('jerr').textContent="No game with that code."; return; }
    const stored = localStorage.getItem('up_pid_'+code);
    const pref = stored ? roomRef.child('players/'+stored) : roomRef.child('players').push();
    const pid = pref.key;
    localStorage.setItem('up_pid_'+code, pid);
    pref.update({name}).then(()=> playerRoom(code, pid, name))
      .catch(e=> document.getElementById('jerr').textContent=e.message);
  }).catch(e=> document.getElementById('jerr').textContent=e.message);
}
function playerRoom(code, pid, name){
  const ref = db.ref('rooms/'+code);
  ref.on('value', snap=>{
    const room = snap.val();
    if(!room){ app.innerHTML=`<div class="card"><h2>The game ended.</h2><button class="btn" onclick="location.href=location.pathname">Back</button></div>`; return; }
    renderPlayer(code, pid, name, room);
  });
}
function renderPlayer(code, pid, name, room){
  const myScore = scoresFromAnswers(room.answers||{})[pid]||0;
  if(room.status==='lobby'){
    app.innerHTML = `<div class="card" style="text-align:center;"><div class="eyebrow">You're in</div>
      <h1>${esc(name)}</h1><p class="muted">Waiting for the host to start…</p></div>`;
    return;
  }
  if(room.status==='done'){
    const lb=leaderboard(room); const rank=lb.findIndex(p=>p.pid===pid)+1; const win=lb[0];
    app.innerHTML = `<div class="card" style="text-align:center;">
      <div class="eyebrow">Final</div>
      <h1>${rank===1?'\u{1F3C6} You won!':'You placed #'+rank}</h1>
      <p class="big-num">${myScore} pts</p>
      ${win&&rank!==1?`<p class="muted">${esc(win.name)} won with ${win.score}.</p>`:''}
    </div>`;
    return;
  }
  const r=room.round|0, R=ROUNDS[r];
  const myAns = room.answers && room.answers[r] ? room.answers[r][pid] : undefined;
  const revealing = room.status==='reveal';
  if(revealing){
    const best = R.type==='quiz' ? R.options.findIndex(o=>o.correct) : R.options.reduce((bi,o,i,a)=> o.points>a[bi].points?i:bi,0);
    const gotBest = myAns===best;
    const earned = myAns!=null ? (R.options[myAns].points||0) : 0;
    app.innerHTML = `<div class="card" style="text-align:center;">
      <div class="eyebrow">Q${r+1} · result</div>
      <h2 style="color:${earned>0?'var(--good)':'var(--bad)'};">${myAns==null?'No answer':'+'+earned+' pts'}</h2>
      <p>${R.type==='quiz'? (gotBest?'Correct!':'The answer was: '+esc(R.options[best].text)) : 'Best for equality: '+esc(R.options[best].text)}</p>
      <p class="muted">Your score: <strong>${myScore}</strong></p>
      <p class="muted">Waiting for the host…</p>
    </div>`;
    return;
  }
  // playing
  if(myAns!=null){
    app.innerHTML = `<div class="card" style="text-align:center;"><div class="eyebrow">Q${r+1} · answer locked</div>
      <h2>${esc(R.options[myAns].text)}</h2><p class="muted">Waiting for everyone else…</p>
      <p class="muted">Your score: <strong>${myScore}</strong></p></div>`;
    return;
  }
  app.innerHTML = `<div class="card">
    <div class="eyebrow">Q${r+1} of ${ROUNDS.length}${R.year?' · '+esc(R.year):''}</div>
    <h2>${esc(R.prompt)}</h2>
    <div class="opts">
      ${R.options.map((o,oi)=>`<button class="opt o${oi}" data-opt="${oi}">${esc(o.text)}</button>`).join('')}
    </div>
    <p class="muted">Your score: ${myScore}</p>
  </div>`;
  app.querySelectorAll('[data-opt]').forEach(b=> b.onclick=()=>{
    db.ref('rooms/'+code+'/answers/'+r+'/'+pid).set(+b.dataset.opt).catch(e=>alert(e.message));
  });
}

start();
</script>
</body>
</html>
