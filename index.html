<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Unfinished Promise: A Civic Virtue Game</title>
<style>
  /* ============================================================
     THEME + LAYOUT (engine styling — safe to leave alone)
     Parchment tones, serif headings, high contrast for projector.
     ============================================================ */
  :root{
    --parchment:#f4ecd6;
    --parchment-2:#efe3c4;
    --card:#fbf6e7;
    --ink:#2a2118;
    --ink-soft:#5c4f3d;
    --accent:#7c2b23;      /* colonial red — headings, primary buttons */
    --accent-2:#5a3410;
    --madison:#254a70;     /* federalist blue */
    --madison-bg:#e7eef5;
    --brutus:#6b4a12;      /* anti-federalist brown/gold */
    --brutus-bg:#f3ead2;
    --good:#2f6b3c;        /* lived up */
    --good-bg:#e4f0e2;
    --bad:#9c3324;         /* fell short */
    --bad-bg:#f4e2dc;
    --neutral:#4a4636;
    --neutral-bg:#ece5cf;
    --border:#c9b487;
    --border-dark:#a8905f;
    --shadow:0 2px 0 rgba(90,52,16,.12), 0 6px 18px rgba(70,45,10,.10);
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --root-size:17px;
    --maxw:880px;
  }
  *{box-sizing:border-box;}
  html{font-size:var(--root-size);}
  body{
    margin:0;
    background:var(--parchment);
    background-image:radial-gradient(circle at 20% 10%, rgba(255,255,255,.35), transparent 40%),
                     radial-gradient(circle at 85% 90%, rgba(120,80,20,.06), transparent 45%);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:var(--serif);}
  a{color:var(--madison);}

  /* ---- top toolbar ---- */
  .toolbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:8px 16px;
    background:rgba(244,236,214,.94);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(4px);
  }
  .toolbar .brand{font-family:var(--serif);font-weight:700;color:var(--accent);margin-right:auto;font-size:1rem;letter-spacing:.3px;}
  .toolbar .brand small{display:block;font-family:var(--sans);font-weight:400;color:var(--ink-soft);font-size:.72rem;letter-spacing:0;}
  .tbtn{
    font-family:var(--sans);font-size:.82rem;
    background:var(--card);color:var(--ink);
    border:1px solid var(--border-dark);border-radius:8px;
    padding:6px 11px;cursor:pointer;white-space:nowrap;
  }
  .tbtn:hover{border-color:var(--accent);}
  .tbtn.on{background:var(--accent);color:#fdf6e6;border-color:var(--accent);font-weight:600;}

  /* ---- main stage ---- */
  .wrap{max-width:var(--maxw);margin:0 auto;padding:26px 16px 80px;}
  .screen{animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none;}}

  .eyebrow{font-family:var(--sans);text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--accent);font-weight:700;}
  h1.title{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:.2em 0 .1em;color:var(--accent);}
  h2{font-size:clamp(1.4rem,3.6vw,2rem);color:var(--accent-2);margin:.1em 0 .4em;}
  h3{font-size:1.15rem;margin:0 0 .3em;}
  p{margin:.5em 0;}
  .lede{font-size:1.12rem;color:var(--ink-soft);}
  .muted{color:var(--ink-soft);}
  .center{text-align:center;}

  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);margin:16px 0;
  }
  .panel{background:var(--parchment-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:12px 0;}

  /* progress */
  .progress{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.8rem;color:var(--ink-soft);}
  .pips{display:flex;gap:5px;}
  .pip{width:26px;height:6px;border-radius:3px;background:var(--border);}
  .pip.done{background:var(--accent);}
  .pip.cur{background:var(--madison);}

  /* buttons */
  .btn{
    font-family:var(--sans);font-size:1rem;font-weight:600;
    background:var(--accent);color:#fdf6e6;border:none;border-radius:10px;
    padding:12px 22px;cursor:pointer;box-shadow:var(--shadow);
  }
  .btn:hover{filter:brightness(1.06);}
  .btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--border-dark);box-shadow:none;}
  .btn.ghost{background:transparent;color:var(--madison);border:1px solid var(--border-dark);box-shadow:none;font-weight:500;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px;}
  .spacer{flex:1;}

  /* advisor cards */
  .advisors{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;}
  .advisor{border-radius:12px;padding:14px 16px;border:1px solid var(--border);}
  .advisor.madison{background:var(--madison-bg);border-color:#b9cbdd;}
  .advisor.brutus{background:var(--brutus-bg);border-color:#d8c391;}
  .advisor .who{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
  .advisor .name{font-family:var(--serif);font-weight:700;font-size:1.05rem;}
  .advisor.madison .name{color:var(--madison);}
  .advisor.brutus .name{color:var(--brutus);}
  .advisor .side{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);}
  .advisor blockquote{margin:0 0 8px;font-family:var(--serif);font-style:italic;font-size:1rem;line-height:1.5;border-left:3px solid currentColor;padding-left:10px;}
  .advisor.madison blockquote{color:var(--madison);}
  .advisor.brutus blockquote{color:var(--brutus);}
  .advisor .gloss{font-size:.92rem;color:var(--ink);}
  .advisor .src{font-size:.72rem;color:var(--ink-soft);margin-top:6px;}
  .advisor.morris{background:var(--brutus-bg);border-color:#d8c391;}
  .advisor.morris .name{color:var(--brutus);}
  .advisor.morris blockquote{color:var(--brutus);}

  /* choices */
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .choice{
    text-align:left;width:100%;background:var(--card);border:1px solid var(--border-dark);
    border-radius:10px;padding:13px 15px;cursor:pointer;font-family:var(--sans);font-size:1rem;color:var(--ink);
    display:flex;gap:12px;align-items:flex-start;
  }
  .choice:hover{border-color:var(--accent);background:#fffdf4;}
  .choice .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fdf6e6;display:grid;place-items:center;font-weight:700;font-size:.85rem;}
  .choice .ctext{flex:1;}
  .choice .cost{display:block;font-size:.85rem;color:var(--bad);margin-top:3px;}
  .choice.picked{border-color:var(--madison);background:#eef3f8;box-shadow:inset 0 0 0 1px var(--madison);}

  /* vote counters (presenter) */
  .voterow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border-dark);border-radius:10px;padding:10px 12px;}
  .voterow .ctext{flex:1;}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--border-dark);background:var(--parchment-2);font-size:1.2rem;font-weight:700;cursor:pointer;color:var(--ink);}
  .stepper button:hover{border-color:var(--accent);}
  .stepper .count{min-width:2ch;text-align:center;font-weight:700;font-size:1.15rem;font-family:var(--serif);}

  /* verdict badges */
  .badge{display:inline-block;font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:999px;letter-spacing:.03em;}
  .badge.up{background:var(--good-bg);color:var(--good);border:1px solid var(--good);}
  .badge.short{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);}
  .badge.neutral{background:var(--neutral-bg);color:var(--neutral);border:1px solid var(--border-dark);}

  .outcome{border-left:5px solid var(--border-dark);}
  .outcome.up{border-left-color:var(--good);}
  .outcome.short{border-left-color:var(--bad);}
  .outcome .why{font-style:italic;color:var(--ink-soft);margin-top:8px;}

  /* quiz */
  .q{margin:14px 0;}
  .q .qtext{font-weight:600;margin-bottom:8px;}
  .opt{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--border-dark);border-radius:9px;margin:6px 0;cursor:pointer;background:var(--card);}
  .opt:hover{border-color:var(--accent);}
  .opt.picked{border-color:var(--madison);background:#eef3f8;box-shadow:inset 0 0 0 1px var(--madison);}
  button.opt{font:inherit;text-align:left;width:100%;-webkit-appearance:none;appearance:none;}
  .opt .letter{flex:none;width:24px;height:24px;border-radius:6px;background:var(--parchment-2);display:grid;place-items:center;font-weight:700;font-size:.8rem;}
  .opt.correct{border-color:var(--good);background:var(--good-bg);}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg);}

  /* report card table */
  .rc{width:100%;border-collapse:collapse;margin-top:10px;}
  .rc th,.rc td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
  .rc th{font-family:var(--serif);color:var(--accent-2);font-size:.95rem;}
  .rc td .yr{font-family:var(--serif);font-weight:700;color:var(--accent);}
  .rc td ul{margin:4px 0 0;padding-left:18px;}
  .rc td li{font-size:.92rem;}

  .scorebig{font-family:var(--serif);font-size:2.4rem;color:var(--accent);font-weight:700;}
  .scorewrap{display:flex;gap:26px;flex-wrap:wrap;align-items:center;justify-content:center;margin:10px 0;}
  .scorewrap .arrow{font-size:2rem;color:var(--ink-soft);}
  .delta{font-weight:700;}
  .delta.pos{color:var(--good);}
  .delta.neg{color:var(--bad);}

  /* action + sources */
  .action{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px dashed var(--border);}
  .action .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--madison);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:700;}
  .action .abody{flex:1;}
  .action a{font-weight:600;}
  .srcgroup{margin:14px 0;}
  .srcgroup li{margin:8px 0;font-size:.95rem;}

  .kbd{font-family:var(--sans);font-size:.72rem;background:var(--parchment-2);border:1px solid var(--border-dark);border-radius:5px;padding:1px 6px;}
  .hint{font-size:.82rem;color:var(--ink-soft);margin-top:8px;}
  .flag{background:#fff6d6;border:1px dashed var(--border-dark);border-radius:8px;padding:8px 10px;font-size:.82rem;color:var(--accent-2);margin:10px 0;}

  /* mobile */
  @media (max-width:640px){
    .advisors{grid-template-columns:1fr;}
    .wrap{padding:20px 14px 70px;}
    .toolbar .brand small{display:none;}
  }

  /* ---- PRESENTER MODE: big type, roomy, projector-friendly ---- */
  body.presenter{--root-size:22px;--maxw:1080px;}
  body.presenter .lede{font-size:1.25rem;}
  body.presenter .advisor blockquote{font-size:1.15rem;}
  body.presenter .btn{padding:14px 28px;font-size:1.1rem;}
  body.presenter .hint.solo-only{display:none;}
  body.presenter .presenter-only{display:block;}
  .presenter-only{display:none;}
  body:not(.presenter) .presenter-only{display:none;}

  /* ================================================================
     PER-ERA VISUAL THEMING  —  RADICAL / IMMERSIVE  (driven by
     the <body data-era="…"> attribute set in render()).
     Each era RE-STAGES the whole page: the body is the "surround"
     (desk / poster wall / newsprint / app background) and .wrap is
     the "artifact" (parchment sheet / poster / newspaper page / app
     panel), with its own toolbar skin, headings, buttons and cards.
     STILL CONSTANT so nothing breaks: layout skeleton, spacing,
     --root-size, --maxw, body.presenter (big-type), the mobile
     stacking, and character/verdict identity tokens
     (--madison,--brutus,--good,--bad and their -bg).
     All offline: web-safe fonts + pure-CSS textures only.
     ================================================================ */

  body{transition:background-color .5s ease, color .5s ease;}
  .wrap{transition:background-color .5s ease, border-color .5s ease, box-shadow .5s ease;}

  /* ============ 1787 · FOUNDING — aged manuscript on a desk ============ */
  body[data-era="founding"]{
    --parchment:#ECE3CE; --parchment-2:#E7D9B8; --card:#F6EFDC;
    --ink:#2B2016; --ink-soft:#5c4a32;
    --accent:#7A2E24; --accent-2:#1F3A5F;
    --border:#C2AC7E; --border-dark:#9c8659;
    --serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:Georgia,"Times New Roman",serif;
    background:#2c1f12;
    background-image:
      radial-gradient(120% 90% at 50% 0%, #4a3620 0%, #2c1f12 60%, #1f1509 100%),
      repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 3px, transparent 3px 9px);
  }
  body[data-era="founding"] .wrap{
    position:relative;
    background:#f3e8cf;
    background-image:
      radial-gradient(circle at 50% 0%, rgba(255,250,235,.75), transparent 60%),
      repeating-linear-gradient(0deg, rgba(60,45,25,.045) 0 1px, transparent 1px 5px);
    border:1px solid #b89b6a;
    box-shadow:0 22px 55px rgba(0,0,0,.55), inset 0 0 70px rgba(120,90,50,.14);
    padding:36px 30px 66px; margin:22px auto 44px; border-radius:2px;
  }
  body[data-era="founding"] .wrap::before{
    content:""; position:absolute; inset:14px;
    border:2px double #8a6a3a; pointer-events:none;
  }
  body[data-era="founding"] .toolbar{background:rgba(38,26,15,.94);border-bottom:1px solid #6b4f2c;}
  body[data-era="founding"] .toolbar .brand{color:#ecd6a8;}
  body[data-era="founding"] .toolbar .brand small{color:#c3a878;}
  body[data-era="founding"] .tbtn{background:#48351f;color:#f0e2c6;border-color:#6b4f2c;}
  body[data-era="founding"] .tbtn.on{background:var(--accent);border-color:var(--accent);}
  body[data-era="founding"] h1.title,
  body[data-era="founding"] h2,
  body[data-era="founding"] h3{
    font-variant:small-caps; letter-spacing:.02em;
    text-shadow:0 1px 0 rgba(255,251,240,.75), 0 -1px 0 rgba(43,32,22,.2);
  }
  body[data-era="founding"] h2{border-bottom:3px double var(--accent);padding-bottom:.12em;}
  body[data-era="founding"] .eyebrow{display:block;text-align:center;letter-spacing:.26em;color:var(--accent);}
  body[data-era="founding"] .eyebrow::before{content:"\275E   ";}
  body[data-era="founding"] .eyebrow::after{content:"   \275E";}
  body[data-era="founding"] .card .lede::first-letter{
    font-size:3.1em; float:left; line-height:.72; padding:.06em .12em 0 0;
    color:var(--accent); font-family:var(--serif); font-weight:700;
  }
  body[data-era="founding"] .card,
  body[data-era="founding"] .choice{border-radius:0;}
  body[data-era="founding"] .btn{border-radius:0;font-variant:small-caps;letter-spacing:.05em;}
  body[data-era="founding"] .btn:not(.secondary):not(.ghost){
    border:1px solid #45170f; box-shadow:0 2px 0 #45170f;
  }

  /* keep the parchment frame comfortable on phones */
  @media (max-width:640px){
    body[data-era="founding"] .wrap{padding:24px 18px 54px;}
    body[data-era="founding"] .wrap::before{inset:9px;}
  }

  /* honor reduced-motion for the era transitions too */
  @media (prefers-reduced-motion:reduce){body,.wrap{transition:none;}}

  /* ---- branching feature: stability meter, real/counterfactual tags, endings ---- */
  .stability{margin:2px 0 16px;}
  .stability .top{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;margin-bottom:5px;}
  .stability .label{font-weight:700;letter-spacing:.02em;}
  .stability .track{height:14px;border:1px solid var(--border-dark);border-radius:999px;background:var(--parchment-2);overflow:hidden;}
  .stability .fill{height:100%;border-radius:999px;transition:width .5s ease, background-color .5s ease;}
  .delta-note{font-size:.85rem;font-weight:700;margin:2px 0 6px;}
  .delta-note.pos{color:var(--good);} .delta-note.neg{color:var(--bad);}
  .tag{display:inline-block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 9px;border-radius:999px;vertical-align:middle;}
  .tag.real{background:var(--good-bg);color:var(--good);border:1px solid var(--good);}
  .tag.cf{background:#efe6d0;color:var(--accent-2);border:1px solid var(--border-dark);}
  .ending{text-align:center;padding-top:2vh;}
  .ending .big{font-family:var(--serif);font-size:clamp(1.9rem,6vw,3.1rem);line-height:1.05;margin:.15em 0 .3em;color:var(--accent);}
  .ending.collapse .big{color:var(--bad);}
  .ending .card,.ending .stability{text-align:left;}
  .pathlist{list-style:none;padding:0;margin:6px 0 0;}
  .pathlist li{padding:8px 0;border-bottom:1px solid var(--border);}
  .pathlist li:last-child{border-bottom:none;}
  .ptimer{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;display:flex;align-items:center;gap:8px;background:var(--panel,#fff);border:2px solid var(--ink,#222);border-radius:12px;padding:6px 12px;box-shadow:0 6px 18px rgba(0,0,0,.22);}
  .ptimer[hidden]{display:none;}
  .ptimer #ptimerDisplay{font-size:1.7rem;font-weight:800;min-width:3.4ch;text-align:center;font-variant-numeric:tabular-nums;}
  .ptimer.done #ptimerDisplay{color:var(--bad,#c0392b);}
  .ptimer .btn{padding:4px 10px;font-size:.85rem;}
</style>
</head>
<body data-era="founding">
  <div class="toolbar">
    <div class="brand">The Unfinished Promise
      <small>Justice and equality, from the Declaration to the Constitution</small>
    </div>
    <button class="tbtn" id="presenterBtn" data-action="toggle-presenter">Presenter mode: Off</button>
    <button class="tbtn" data-action="export-csv" title="Download vote &amp; quiz tallies as CSV">Export CSV</button>
    <button class="tbtn" data-action="export-json" title="Download vote &amp; quiz tallies as JSON">Export JSON</button>
    <button class="tbtn" data-action="restart" title="Restart from the title screen">Restart</button>
  </div>
  <div class="wrap"><div id="app"></div></div>

<script>
/* ================================================================
   ===============   EDIT CONTENT HERE   ==========================
   Everything a writer might change lives in CONTENT and QUOTES.
   The game ENGINE is farther down and does not need to be touched.

   Content rules honored here:
   - Every Morris/Madison quote below is the EXACT text of its source
     (see the Sources page). Do NOT paraphrase inside quotation marks.
   - "What really happened" screens are 3–4 sentences.
   ================================================================ */

/* Verbatim quote bank. Advisors reference these by key so a quote is
   written once and reused correctly. (source shown on cards + Sources page) */
const QUOTES = {
  morris: { // Gouverneur Morris: wrote the Constitution's final wording; the Convention's leading anti-slavery voice
    curse:   "He never would concur in upholding domestic slavery. It was a nefarious institution. It was the curse of Heaven on the States where it prevailed.",
    justice: "We the People of the United States, in Order to form a more perfect Union, establish Justice… do ordain and establish this Constitution for the United States of America."
  },
  madison: { // James Madison: Federalist 10 & 51, drafted the Bill of Rights
    majority:   "Measures are too often decided, not according to the rules of justice and the rights of the minor party, but by the superior force of an interested and overbearing majority.",
    endofgov:   "Justice is the end of government. It is the end of civil society.",
    property:   "…wrong to admit in the Constitution the idea that there could be property in men.",
    dueprocess: "No person shall… be deprived of life, liberty, or property, without due process of law."
  }
};

const CONTENT = {
  meta: {
    title: "The Unfinished Promise",
    hook: "It is 1776 and you are in the room. Every choice that leads us to 1954 will have its impact on the meter above, reflecting the country's commitment to the founding idea.",
    virtue: "Justice",
    sub: "The game takes place at various crossroads from 1776 to 1954, and it interprets all of them through the Declaration of Independence and the US Constitution."
  },

  intro: {
    what: "In the context of the game, <strong>justice</strong> is making laws and institutions that pursue <strong>equality</strong> between people. The Declaration stated that \"all men are created equal\" in 1776, but about one in five colonists were enslaved. The game's scenarios will lead you to come back to this civic virtue.",
    setup: [
      ["Gouverneur Morris, a Pennsylvania delegate who wrote the final wording of the Constitution", "morris", "He delivered the most radical speech about slavery at the Convention, saying he would rather pay a tax to free all the slaves in the country than for it to continue in future generations. Overall, he will advise you to achieve justice by any means necessary."],
      ["James Madison, a Virginia delegate who wrote Federalist 10 and 51 and drafted the Bill of Rights", "madison", "Madison has a more complex relationship with slavery. For example, he owned more than a hundred slaves at Montpelier until his death, but he also fought to exclude slavery from the Constitution. He will advise you to fight for the rights of minorities, however it might not be by any means necessary."]
    ],
    vdscv: [
      ["V (Value)", "Equality: the equal intrinsic worth of every person and every group, and their equal claim to rights and to legal and social protection, regardless of their position or status and even if they represent a minority within a larger majority."],
      ["D (Danger)", "The tyranny of the majority: when the ruling or simply more powerful groups use the law to deny equality to other groups, as in slavery, Jim Crow, and voter suppression."],
      ["S (Solution)", "The enshrinement in the Declaration and Constitution and subsequent amendments, legislation, and judicial rulings (such as the Fourteenth Amendment and Brown v. Board) of the ideal of equality as a moral imperative and legal requirement."],
      ["CV (Civic Virtue)", "Justice: the virtue of demanding and achieving equality as a matter of course, and above all extending it to those groups who might be overlooked by the majority."]
    ]
  },

  /* 3 questions. The same set is used for the pre-quiz and the post-quiz. */
  quiz: [
    {
      id:"q1",
      q:"What does the Declaration of Independence say about people?",
      options:[
        "That only landowners have rights.",
        "That all men are created equal, with certain unalienable rights.",

  story: {

    nodes: {

      /* ---------- CHAPTER 1 · 1776 · THE PROMISE ---------- */
      "n_decl": {
        era:"founding", year:"1776", chapter:"The Promise",
        subtitle:"Jefferson's draft has a paragraph the South will oppose.",
        scenario:"Jefferson's draft blames the King for the slave trade and calls it \"cruel war against human nature itself.\" South Carolina and Georgia demand its removal, and some northern delegates seem ready to agree, since colonial ships have long been transporting slaves. What will you do?",
        advisors:{
          morris:{ key:"curse", gloss:"If the first official document calls slavery a \"war against human nature,\" all laws which follow must also follow this policy." },
          madison:{ key:"property", gloss:"The British are landing on Staten Island this week, and losing two colonies would undermine everything we are doing." }
        },
        choices:[
          { short:"Keep the anti-slavery passage", label:"Keep Jefferson's wording about the slave trade, despite the South's opposition.", cost:"South Carolina and Georgia may withhold their approval while the British army marches towards New York.", stability:12, flags:["idealism"], next:"n_const",
            outcome:{ tag:"cf", text:"The risk was real. South Carolina voted against independence on July 1 and changed its decision the next day, so it could turn against the Declaration again. You would end up with a document only eleven colonies signed, decreasing the unity between the colonies in the nation.", why:"The Declaration would have been stronger with Jefferson's wording, but it is necessary to ensure the document's adoption." } },
          { short:"Cut the passage to keep the union", label:"Remove Jefferson's paragraph on the slave trade to gain all thirteen colonies, but keep that \"all men are created equal.\"", cost:"You deliver a document that excludes half a million people from the protected \"all men.\"", stability:-8, flags:["contradiction"], next:"n_const",
            outcome:{ tag:"real", text:"Congress cut this paragraph. Jefferson later admitted it was deleted \"in complaisance to South Carolina and Georgia,\" and that the northern delegates did not object, since they profited from the slave trade too. The Declaration made no mention of slavery, though it continued in all colonies.", why:"This is where \"all men are created equal\" becomes a problem for the slaves, and it will take almost a century to change. In 1852, Frederick Douglass asked the residents of Rochester, \"What, to the American slave, is your 4th of July?\"" } },
          { short:"Water it down", label:"Keep a vague statement about equality but remove anything about slavery.", cost:"You weaken the Declaration's wording before it is even adopted.", stability:-6, flags:["vague"], next:"n_const",
            outcome:{ tag:"cf", text:"A more careful wording that does not mention the slavery present makes it easier for it to be adopted, but it also makes the lives of minority groups harder. Movements kept returning to the Declaration's promise and argued that equality should be provided. In 1848, the Seneca Falls Convention's Declaration of Sentiments declared that \"all men and women are created equal.\"", why:"Without this wording present the abolitionists will have nothing to refer to in their protest for equal rights." } }
        ]
      },

      /* ---------- CHAPTER 2 · 1787 · THE CONSTITUTION ---------- */
      "n_const": {
        era:"founding", year:"1787", chapter:"The Compromise",
        subtitle:"The Convention must decide what to do about slavery.",
        scenario:"It is August 1787 in Philadelphia. The delegates are debating whether to count slaves toward representation in Congress and whether Congress can ban the slave trade. On August 8, Gouverneur Morris calls slavery \"the curse of Heaven on the States where it prevailed.\" What will you do?",
        advisors:{
          morris:{ key:"curse", gloss:"Slavery should be ended as soon as possible, because the representation of slaves will give the Southern States an advantage due to its increase of voting population." },
          madison:{ key:"property", gloss:"Abolishing slavery is a great thing, however the most important thing is keeping a union among ourselves." }
        },
        choices:[
          { short:"Push to end slavery now", label:"Use the slave trade issue to urge the Union to abolish slavery immediately.", cost:"The Deep South states may refuse to participate in the Convention.", stability:12, flags:["abolition"], next:"n_const_abolition",
            outcome:{ tag:"cf", text:"Deep South representatives openly stated they would leave if slavery was not even mentioned in the new Constitution. On August 21, John Rutledge of South Carolina told the Convention the real issue was not slavery but the preservation of the Union. Forcing abolition may dissolve the Convention, so slavery would not end until 1865.", why:"The 13th Amendment, which abolished slavery, was adopted in 1865, so the Constitution needed to be adopted in 1787." } },
          { short:"Accept the compromises", label:"Accept the compromise on counting slaves and the slave trade to ensure the Constitution is adopted by all states.", cost:"The new Constitution will protect slavery for a long time.", stability:-10, flags:["compromise"], next:"n_14th",
            outcome:{ tag:"real", text:"Slaves are counted as three fifths of the population, giving slave states more seats. The ban on the slave trade only occurs in 1808. The Constitution never says \"slavery,\" but several clauses protect it.", why:"Through the three-fifths clause, slave states gained an advantage in both Congress and presidential elections. Thomas Jefferson used this as an advantage during his campaign." } },
          { short:"Ban the trade, keep the rest", label:"Immediately ban the Atlantic slave trade but leave the rest of slavery intact.", cost:"You stop the trade of slaves, but those already enslaved stay enslaved.", stability:-4, flags:["tradeban"], next:"n_14th",
            outcome:{ tag:"cf", text:"The Atlantic slave trade was banned on January 1, 1808, but the domestic trade was not changed. This has little effect on the South, where slavery stayed for another century. However, it stops new slaves from being imported, but frees no one already enslaved.", why:"This has a minimal effect on the slaves, as it only stops the importation of slaves." } }
        ]
      },

      "n_const_abolition": {
        era:"founding", year:"1787", chapter:"The Union in the Balance",
        subtitle:"The Deep South delegates are packing up.",
        scenario:"You pushed for an immediate ban on slavery, and the Convention is collapsing. The Georgia and South Carolina delegates are leaving, and the Middle colonies are pressuring you to propose something the Deep South can accept. What will you do?",
        advisors:{
          morris:{ key:"curse", gloss:"To disregard the South if they leave, he believes that a union without slavery is better than one which is complete." },
          madison:{ key:"majority", gloss:"You can win the argument by \"the superior force of an interested and overbearing majority\" but still fail to create the Union needed to stop slavery." }
        },
        choices:[
          { short:"Hold firm, no Union with slavery", label:"Do not accept South's demands.", cost:"You may end up with two countries on one continent, one slave and one free.", stability:-6, flags:["rupture"], next:"n_14th",
            outcome:{ tag:"cf", text:"Most historians believe South Carolina and Georgia would not have joined an anti-slavery Union. The Convention would lead to two separate countries, and the South would be even open to slavery.", why:"Even though your choices were based on ethical means, slaves in the South would now face a harsher reality." } },
          { short:"Win a gradual abolition clause", label:"Enact a policy that abolishes slavery over time.", cost:"Gradual abolition can take a very long time.", stability:8, flags:["gradual"], next:"n_14th",
            outcome:{ tag:"cf", text:"A gradual abolition clause does little to stop slavery. For example, Pennsylvania passed a similar law in 1780, but it did not free slaves immediately. Overall, this would benefit the masters much more than the slaves.", why:"When writing such a law, it is important to set the date to it." } },
          { short:"Cave entirely", label:"Agree to Deep South demands and adopt them in the Constitution.", cost:"You get a Constitution that protects slavery even more.", stability:-16, flags:["cave"], next:"n_14th",
            outcome:{ tag:"cf", text:"Giving way means a Constitution that supports slavery even more. Overall, the Constitution would be harder to amend later.", why:"Every clause adopted in favor of the slave owners in 1787 will have to be repealed in 1865." } }
        ]

        subtitle:"Slavery is over, but what about freedom?",

        advisors:{
          morris:{ key:"justice", gloss:"The Constitution's preamble says it was adopted to \"establish Justice,\" however as of now, many minority groups in the South are faced with oppression." },
          madison:{ key:"endofgov", gloss:"He expresses the government's important role in order to ensure equality among citizens." }

        choices:[
          { short:"Ratify and enforce it", label:"Ratify the 14th Amendment and enforce Black citizenship and voting rights.", cost:"You will have to keep federal troops in the South.", stability:14, flags:["reconstruction"], next:"n_brown",
            outcome:{ tag:"cf", text:"The newly freed slaves are far better off with citizenship and voting rights. Now oppressed individuals are able to grow to power.", why:"After Blanche Bruce resigned as senator from Mississippi in 1881, no other Black American from the South served in the Senate until 2013." } },
          { short:"Ratify, but leave it to the states", label:"Ratify the Amendment but leave enforcement to the states.", cost:"Without federal oversight, the states will ignore the rights the Amendment guarantees.", stability:-6, flags:["jimcrow"], next:"n_reconstruction_fails",
            outcome:{ tag:"real", text:"This is closest to what actually happened. The 14th Amendment was ratified in July 1868, but the Compromise of 1877 removed federal troops from the South. The states adopted discriminatory laws.", why:"Other Southern states quickly followed Mississippi's lead, imposing similar restrictions." } },
          { short:"Restore the old order", label:"Revoke the 14th Amendment and allow the old slave owners to take over the South again.", cost:"You sacrifice the freedom of Black Americans for \"peace\" between white Southerners and Northerners.", stability:-20, flags:["redemption"], next:"end_collapse",
            outcome:{ tag:"cf", text:"White Southerners take control of the states again. They called this \"Redemption,\" and it involved a lot of violence directed at Black Americans.", why:"By failing to ensure equality, you let Southerners regain control of the government, leading to decades of repression." } }
        ]
      },

      "n_reconstruction_fails": {
        era:"watergate", year:"1896", chapter:"Separate but Equal",
        subtitle:"Homer Plessy was ordered to leave the \"whites only\" railroad car.",
        scenario:"On June 7, 1892, Homer Plessy, a New Orleans resident who was one-eighth Black, bought a first-class ticket and sat in the first-class car, prohibited for Black passengers under Louisiana law. He was arrested on purpose, a deliberate test case set up with a local New Orleans civil rights group. Now the Supreme Court must decide whether to repeal the Louisiana law. What will you do?",
        advisors:{
          morris:{ key:"justice", gloss:"The \"equal protection of the laws\" clause does not allow separate facilities, and the Court should repeal this law right away." },
          madison:{ key:"dueprocess", gloss:"Arresting Plessy simply for sitting in the \"wrong\" car violates his freedom which was guaranteed to him in the Constitution." }
        },
        choices:[
          { short:"Reject \"separate but equal\"", label:"Highlights the difference of separate but equal as a direct violation of the 14th Amendment.", cost:"You will have to face the racism of the entire state.", stability:12, flags:["earlybrown"], next:"n_brown",
            outcome:{ tag:"cf", text:"One justice, John Harlan, argued exactly this in his dissent, writing that \"our constitution is color-blind, and neither knows nor tolerates classes among citizens.\"", why:"It took the Court fifty-eight years to revisit the issue." } },
          { short:"Uphold \"separate but equal\"", label:"Declare \"separate but equal\" constitutional and leave the fate of Black Americans to the states.", cost:"Black Americans will suffer for the next fifty-eight years.", stability:-14, flags:["plessy"], next:"n_brown",
            outcome:{ tag:"real", text:"The Court ruled 7-1 against Plessy in May 1896. Justice Henry Billings Brown wrote that the Louisiana law did not violate the 14th Amendment, since Black citizens were satisfied with separate facilities. Southern states took this as a signal to introduce Jim Crow laws, which governed almost every part of life in the South for nearly a century.", why:"Plessy was the law for fifty-eight years of Jim Crow, and for that whole time every segregation law could have had the Supreme Court as its shield." } },

            outcome:{ tag:"cf", text:"Plessy's case is sent back to the states without answering the question of legality. While the Court waits, the states pass segregation laws until they return to the Court.", why:"Not deciding leaves the Louisiana law in place." } }
        ]
      },

      /* ---------- CHAPTER 4 · 1954 · BROWN v. BOARD ---------- */
      "n_brown": {
        era:"watergate", year:"1954", chapter:"Brown v. Board",
        subtitle:"A third grade girl's walk to school has reached the Supreme Court.",
        scenario:"In Topeka, Kansas, Linda Brown had to walk across an entire rail yard to catch the bus to the all-Black school when there was a much closer white school; her father sued and her case was combined with several from South Carolina, Virginia, and Delaware. Thurgood Marshall of the NAACP argues that separate schools can never be equal. What should the Court rule?",

  reportThesis:"The honest verdict is \"partly.\" America has never fully lived up to \"all men are created equal\" — the founding fathers wrote it over a country that held about a fifth of its people in slavery. The promise only grew when people forced the issue, through the abolitionists, the 14th Amendment, Harlan's lone dissent, and Brown, and it shrank every time a majority was allowed to decide that some people counted for less. Which way it moves next has always depended on whoever is in the room.",

const LS_KEY = "unfinished-promise_v3";   // schema: persists arc progress
const app = document.getElementById('app');
const presenterBtn = document.getElementById('presenterBtn');
const STORY = CONTENT.story;

const state = {
  i: 0,                 // index into STEPS (framing screens)
  presenter: false,
  arcHist: [],          // branching arc history: [{node, phase:'decide'|'reveal'}]
  arcPos: 0,            // pointer into arcHist
  ended: null,          // ending node id, once reached
  choices: {},          // choices[nodeId] = optionIndex  (arc nodes + today keys 't0','t1')
  votes: {},            // votes[nodeId] = [count per option] (presenter)
  preSolo: {}, postSolo: {}, preHands: {}, postHands: {},
  reveal: {pre:false, post:false}
};

/* ---- ordered framing steps; the whole branching arc lives in one 'arc' step ---- */
const STEPS = [
  {type:'title'}, {type:'howto'}, {type:'prequiz'}, {type:'intro'},
  {type:'arc'},
  {type:'ending'},
  {type:'today', dec:0, phase:'decide'}, {type:'today', dec:0, phase:'reveal'},
  {type:'today', dec:1, phase:'decide'}, {type:'today', dec:1, phase:'reveal'},
  {type:'reportcard'}, {type:'action'}, {type:'postquiz'}, {type:'sources'}
];
function stepIndex(type){ return STEPS.findIndex(s=>s.type===type); }

/* ---- persistence (best-effort; game works without it) ---- */
function save(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      presenter:state.presenter, choices:state.choices, votes:state.votes,
      preSolo:state.preSolo, postSolo:state.postSolo, preHands:state.preHands, postHands:state.postHands,
      i:state.i, arcHist:state.arcHist, arcPos:state.arcPos, ended:state.ended
    }));
  }catch(e){/* private mode / disabled storage — fine */}
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    Object.assign(state, {
      presenter:!!d.presenter, choices:d.choices||{}, votes:d.votes||{},
      preSolo:d.preSolo||{}, postSolo:d.postSolo||{}, preHands:d.preHands||{}, postHands:d.postHands||{},
      arcHist:Array.isArray(d.arcHist)?d.arcHist:[], arcPos:d.arcPos||0, ended:d.ended||null,
      i:(typeof d.i==='number' && d.i>=0 && d.i<STEPS.length)?d.i:0
    });
  }catch(e){/* ignore */}
}

/* ---- small helpers ---- */
function esc(str){ return String(str).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const SRC = {
  morris:{ curse:"G. Morris · Convention, 1787", justice:"the Constitution's Preamble" },
  madison:{ majority:"Federalist 10", endofgov:"Federalist 51", property:"Madison · Convention, 1787", dueprocess:"Bill of Rights · 5th Amendment" }
};
function advisorCard(who, side, key, gloss){
  const q = QUOTES[who][key];
  const src = (SRC[who] && SRC[who][key]) || '';
  return `<div class="advisor ${who}">
    <div class="who"><span class="name">${side}</span></div>
    <blockquote>&quot;${esc(q)}&quot;</blockquote>
    <div class="gloss">${esc(gloss)}</div>
    ${src?`<div class="src">Source: ${esc(src)}</div>`:''}
  </div>`;
}
/* ---- branching helpers: nodes, votes, and the stability meter ---- */
function nodeById(id){ return STORY.nodes[id]; }
function chosenOpt(nodeId){
  if(state.presenter){ const t=topVoteNode(nodeId); return t? t.idx : undefined; }
  return state.choices[nodeId];
}
function getVotesNode(nodeId,n){ if(!state.votes[nodeId]) state.votes[nodeId]=Array(n).fill(0); return state.votes[nodeId]; }
function topVoteNode(nodeId){
  const v=state.votes[nodeId]; if(!v) return null;
  const total=v.reduce((a,b)=>a+b,0); if(total===0) return null;
  let mi=0; v.forEach((n,i)=>{ if(n>v[mi]) mi=i; });
  const tie = v.filter(n=>n===v[mi]).length>1;
  return {idx:mi, count:v[mi], total, tie};
}
function committedRevealFrames(){ return state.arcHist.filter(f=>f.phase==='reveal'); }
function stabilityRaw(upto){
  const end = upto===undefined ? state.arcPos : upto;
  let s = STORY.startStability;
  for(let k=0;k<=end && k<state.arcHist.length;k++){
    const f=state.arcHist[k];
    if(f.phase==='reveal'){ const oi=chosenOpt(f.node); if(oi!=null){ s += (nodeById(f.node).choices[oi].stability||0); } }
  }
  return s;
}
function stabilityClamped(upto){ if(upto===undefined && state.ended==='end_collapse') return 0; return Math.max(0, Math.min(100, stabilityRaw(upto))); }
function stabilityInfo(){
  const v=stabilityClamped();
  let label, color;
  if(v>=80){ label='Living up to it'; color='var(--good)'; }
  else if(v>=45){ label='Contested'; color='#b8860b'; }
  else if(v>=25){ label='Fragile'; color='var(--accent)'; }
  else if(v>=1){ label='Eroding'; color='var(--bad)'; }
  else { label='Betrayed'; color='var(--bad)'; }
  return {v,label,color};
}
function stabilityBar(){
  const {v,label,color}=stabilityInfo();
  return `<div class="stability"><div class="top"><span class="label">The Promise of Equality: ${label}</span><span>${v}/100</span></div>`
    + `<div class="track"><div class="fill" style="width:${v}%;background:${color};"></div></div></div>`;
}

  CONTENT.quiz.forEach((q,qi)=>{

    if(state.presenter){
      // presenter: enter count of correct hands (or hands per option)
      const hands = (isPost?state.postHands:state.preHands)[q.id] || q.options.map(()=>0);
      body += `<p class="muted" style="font-size:.85rem;">Tally a show of hands for each answer, then click <strong>Reveal answers</strong> to score.</p>`;
      q.options.forEach((opt,oi)=>{
        const correct = oi===q.answer;
        body += `<div class="voterow">

      q.options.forEach((opt,oi)=>{
        const cls = picked===oi ? 'opt picked' : 'opt';
        body += `<button type="button" class="${cls}" data-action="quiz-pick" data-phase="${phase}" data-q="${q.id}" data-opt="${oi}">
          <span class="letter">${String.fromCharCode(65+oi)}</span><span>${esc(opt)}</span></button>`;
      });
    }
    body += `</div>`;
  });

  // score preview on post-quiz (gated behind Reveal in presenter mode)
  if(isPost && (!state.presenter || state.reveal.post)){
    body += scoreSummaryBlock();
  }

  const answered = quizAnswered(phase);
  const nextLabel = isPost ? "See sources" : "Continue";
  body += `<div class="btnrow">
      <button class="btn secondary" data-action="back">Back</button>

  if(!answered){
    body += `<p class="hint">${state.presenter?'Enter at least one hand count to continue.':'Answer all three to continue.'}</p>`;
  }
  body += `</div>`;
  return body;
}

function quizAnswered(phase){
  if(state.presenter){
    const src = phase==='post'?state.postHands:state.preHands;
    return CONTENT.quiz.some(q => (src[q.id]||[]).some(n=>n>0));
  } else {
    const src = phase==='post'?state.postSolo:state.preSolo;
    return CONTENT.quiz.every(q => src[q.id]!==undefined);
  }
}

function scrArcDecide(nodeId){

function scrArcReveal(nodeId){
  const n = nodeById(nodeId);
  const oi = chosenOpt(nodeId);
  const c = oi!=null ? n.choices[oi] : null;
  if(!c) return scrArcDecide(nodeId);
  const o = c.outcome;
  const real = o.tag==='real';
  const tag = real ? `<span class="tag real">Real history</span>` : `<span class="tag cf">Counterfactual · best estimate</span>`;
  const heading = real ? "What actually happened" : "What likely would have happened";
  const delta = c.stability||0;
  const dnote = delta===0 ? '' : `<p class="delta-note ${delta>0?'pos':'neg'}">Promise of Equality ${delta>0?'+':''}${delta}</p>`;
  let echo='';
  if(state.presenter){ const t=topVoteNode(nodeId); if(t) echo=`<p class="muted">The class chose <strong>${esc(n.choices[t.idx].short)}</strong> (${t.count} of ${t.total} votes${t.tie?', tie broken to the first option':''}).</p>`; }
  else echo=`<p class="muted">You chose: <strong>${esc(c.short)}</strong>.</p>`;
  const collapsing = stabilityRaw() <= (STORY.collapseAt||0);
  return `<div class="screen">${stabilityBar()}

function scrEnding(){
  if(!state.ended) return `<div class="screen"><p class="muted">…</p></div>`;
  const e = nodeById(state.ended);
  const collapse = e.kind==='collapse';
  let reflection='';
  if(collapse){
    const bad = committedRevealFrames().map(f=>{ const n=nodeById(f.node); const oi=chosenOpt(f.node); return oi!=null?{n,c:n.choices[oi]}:null; })
      .filter(x=>x && (x.c.stability||0)<0);
    if(bad.length){
      reflection = `<div class="card"><h3>Where it went wrong</h3><ul class="pathlist">`
        + bad.map(x=>`<li><strong>${esc(x.n.year)}: ${esc(x.c.short)}.</strong> ${esc(x.c.why||'The promise was left unkept.')}</li>`).join('')
        + `</ul><p class="muted">Any one of these choices might have been survivable on its own, but together they became a pattern of choosing something else over equal justice, and that pattern is what betrayed the promise.</p></div>`;
    }
  }
  return `<div class="screen ending ${collapse?'collapse':''}">
    <div class="eyebrow">${collapse?'Game Over':'Your Ending'}</div>
    <div class="big">${esc(e.title)}</div>
    ${stabilityBar()}
    <div class="card"><p class="lede" style="color:var(--ink);">${esc(e.text)}</p></div>
    ${reflection}
    <div class="btnrow">
      <button class="btn secondary" data-action="restart">Play again</button>
      <span class="spacer"></span>
      <button class="btn" data-action="next">${collapse?'Continue to the reflection &rarr;':'Continue &rarr;'}</button>
    </div>
  </div>`;
}

function scrReport(){
  const frames = committedRevealFrames();
  let rows='';
  frames.forEach(f=>{
    const n=nodeById(f.node); const oi=chosenOpt(f.node); if(oi==null) return;
    const c=n.choices[oi]; const d=c.stability||0;
    const tag = c.outcome.tag==='real' ? `<span class="tag real">Real</span>` : `<span class="tag cf">Alt</span>`;
    rows += `<tr>
      <td><span class="yr">${esc(n.year)}</span><br><span class="muted" style="font-size:.82rem;">${esc(n.chapter)}</span></td>
      <td><strong>${esc(c.short)}</strong> ${tag}</td>
      <td style="${d<0?'color:var(--bad);':'color:var(--good);'}white-space:nowrap;font-weight:700;">${d>0?'+':''}${d}</td></tr>`;
  });
  CONTENT.today.decisions.forEach((d,di)=>{
    const key='t'+di; const p = state.presenter ? ((topVoteNode(key)||{}).idx) : state.choices[key];
    if(p!=null) rows += `<tr><td><span class="yr">Today</span></td><td><strong>${esc(d.choices[p].short)}</strong> <span class="badge neutral" style="font-size:.6rem;">you</span></td><td class="muted">n/a</td></tr>`;
  });
  const e = state.ended ? nodeById(state.ended) : null;
  const {v,label} = stabilityInfo();
  const endLine = e ? `<p class="lede" style="color:var(--ink);">Your timeline ended at <strong>${esc(e.title)}</strong>, with the Promise of Equality meter at ${v}/100 (${esc(label)}).</p>` : '';
  return `<div class="screen">
    <div class="eyebrow">Report Card</div>
    <h2>To what extent has America lived up to this virtue?</h2>
    ${endLine}
    <div class="card" style="background:var(--parchment-2);">
      <h3>The verdict</h3>
      <p class="lede" style="color:var(--ink);">${esc(CONTENT.reportThesis)}</p>
    </div>
    <div class="card" style="overflow-x:auto;">
      <table class="rc">
        <thead><tr><th>Moment</th><th>${state.presenter?'Class chose':'You chose'}</th><th>Meter</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <p class="muted" style="font-size:.82rem;margin-top:8px;"><span class="tag real">Real</span> means the choice matches what actually happened, and <span class="tag cf">Alt</span> means it is an evidence-based estimate of a path that was not taken (see Sources).</p>
    </div>
    ${CONTENT.presentDay?`<div class="card">
      <h3>${esc(CONTENT.presentDay.title)}</h3>
      <p>${esc(CONTENT.presentDay.text)}</p>
      ${CONTENT.presentDay.link?`<p><a href="${esc(CONTENT.presentDay.link.url)}" target="_blank" rel="noopener">${esc(CONTENT.presentDay.link.label)}</a></p>`:''}
    </div>`:''}
    <div class="btnrow">
      <button class="btn secondary" data-action="back">Back</button>
      <button class="btn ghost" data-action="export-csv">Export results (CSV)</button>
      <span class="spacer"></span>
      <button class="btn" data-action="next">What can I do? &rarr;</button>
    </div>
  </div>`;
}

function scrAction(){
  const items = CONTENT.actions.map((a,i)=>{
    const links = a.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join(' &nbsp;·&nbsp; ');
    return `<div class="action">
      <div class="n">${i+1}</div>
      <div class="abody">
        <h3>${esc(a.title)}</h3>
        <p>${esc(a.text)}</p>
        ${links?`<p>${links}</p>`:''}
      </div>
    </div>`;
  }).join('');
  return `<div class="screen">
    <div class="eyebrow">Take Action</div>
    <h2>What can citizens do now?</h2>
    <p class="lede">Here are five things a high school student in McKinney or Collin County can actually do to help make the promise of equality real.</p>
    <div class="card">${items}</div>
    <div class="btnrow">
      <button class="btn secondary" data-action="back">Back</button>
      <span class="spacer"></span>
      <button class="btn" data-action="next">Post-quiz &rarr;</button>
    </div>
  </div>`;
}

function scrSources(){
  const q = CONTENT.sources.quotes.map(s=>`<li>${esc(s.text)} Source: <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.where)}</a></li>`).join('');
  const f = CONTENT.sources.facts.map(s=>`<li>${esc(s.text)} Source: <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.where)}</a></li>`).join('');
  return `<div class="screen">
    <div class="eyebrow">Sources</div>
    <h2>Every quote and claim, cited</h2>
    <div class="card srcgroup">
      <h3>Quotes</h3>
      <ul>${q}</ul>
      <h3 style="margin-top:14px;">Historical facts</h3>
      <ul>${f}</ul>
    </div>
    ${CONTENT.sources.note?`<div class="panel"><strong>How the branches work:</strong> ${esc(CONTENT.sources.note)}</div>`:''}
    <p class="muted">The advisor quotes are copied word for word from the documents and records listed above, and the only changes are the ellipses where words were left out.</p>
    <div class="btnrow">
      <button class="btn secondary" data-action="back">Back</button>
      <button class="btn ghost" data-action="export-json">Export data (JSON)</button>
      <span class="spacer"></span>
      <button class="btn" data-action="restart">Play again</button>
    </div>
  </div>`;
}

/* ---- score summary (used on post-quiz) ---- */
function scoreSummaryBlock(){
  if(state.presenter){
    const pre = handsPct('pre'), post = handsPct('post');
    if(pre.total===0 && post.total===0) return '';
    const d = post.pct - pre.pct;
    return `<div class="card center" style="background:var(--parchment-2);">
      <h3>Class results</h3>
      <div class="scorewrap">
        <div><div class="scorebig">${pre.pct}%</div><div class="muted">before</div></div>
        <div class="arrow">&rarr;</div>
        <div><div class="scorebig">${post.pct}%</div><div class="muted">after</div></div>
      </div>
      <p class="delta ${d>=0?'pos':'neg'}">${d>=0?'+':''}${d} points</p>
      <p class="muted" style="font-size:.85rem;">This is the percent of hands that picked the correct answer across all three questions.</p>
    </div>`;
  } else {
    const pre = soloScore('pre'), post = soloScore('post');
    const d = post - pre;
    return `<div class="card center" style="background:var(--parchment-2);">
      <h3>Your results</h3>
      <div class="scorewrap">
        <div><div class="scorebig">${pre}/3</div><div class="muted">before</div></div>
        <div class="arrow">&rarr;</div>
        <div><div class="scorebig">${post}/3</div><div class="muted">after</div></div>
      </div>
      <p class="delta ${d>=0?'pos':'neg'}">${d>=0?'+':''}${d}</p>
    </div>`;
  }
}
function soloScore(phase){
  const src = phase==='post'?state.postSolo:state.preSolo;
  return CONTENT.quiz.reduce((n,q)=> n + (src[q.id]===q.answer?1:0), 0);
}
function handsPct(phase){
  const src = phase==='post'?state.postHands:state.preHands;
  let correct=0,total=0;
  CONTENT.quiz.forEach(q=>{
    const h = src[q.id]||[];
    h.forEach((n,oi)=>{ total+=n; if(oi===q.answer) correct+=n; });
  });
  return {correct,total,pct: total? Math.round(correct/total*100):0};
}

/* ---- branching arc navigation ---- */
function enterArc(){
  if(!state.arcHist.length){ state.arcHist=[{node:STORY.start, phase:'decide'}]; state.arcPos=0; state.ended=null; }
}
function resolveTier(){
  const s = stabilityRaw();
  if(s <= (STORY.collapseAt||0)) return 'end_collapse';
  for(const t of STORY.tiers){ if(s>=t.min) return t.id; }
  return STORY.tiers[STORY.tiers.length-1].id;
}
function arcAdvance(){
  const f = state.arcHist[state.arcPos];
  if(f.phase==='decide'){
    if(chosenOpt(f.node)==null) return;                 // must choose first
    state.arcHist = state.arcHist.slice(0, state.arcPos+1);
    state.arcHist.push({node:f.node, phase:'reveal'});
    state.arcPos++; save(); render(); return;
  }
  // reveal -> resolve where the story goes next
  const n = nodeById(f.node);
  const c = n.choices[chosenOpt(f.node)];
  let nextId = c.next;
  if(stabilityRaw() <= (STORY.collapseAt||0)) nextId = 'end_collapse';
  else if(nextId==='end_arc') nextId = resolveTier();
  const nx = nodeById(nextId);
  if(nx && nx.ending){ state.ended = nextId; state.i = stepIndex('ending'); save(); render(); return; }
  state.arcHist = state.arcHist.slice(0, state.arcPos+1);
  state.arcHist.push({node:nextId, phase:'decide'});
  state.arcPos++; save(); render();
}
function restart(){ state.i=0; state.arcHist=[]; state.arcPos=0; state.ended=null; state.choices={}; state.votes={}; state.preSolo={}; state.postSolo={}; state.preHands={}; state.postHands={}; state.reveal={pre:false,post:false}; lastScreenKey=null; save(); render(); }

/* ---------------------- ERA THEMING ---------------------- */
/* Maps the current step to a period-accurate visual era. Only re-points
   the <body data-era> attribute; the CSS above does the rest. */
function eraForStep(step){
  // One consistent look from beginning to end (no per-era background switch).
  return 'founding';
}

let lastScreenKey=null;
function screenKey(step){
  if(step.type==='arc'){ const f=state.arcHist[state.arcPos]; return 'arc:'+(f?f.node+':'+f.phase:''); }
  if(step.type==='today') return 'today:'+step.dec+':'+step.phase;
  if(step.type==='ending') return 'ending:'+state.ended;
  return step.type;
}

/* ---------------------- ROUTER ---------------------- */
function render(){
  const step = STEPS[state.i];
  document.body.setAttribute('data-era', eraForStep(step));
  let html='';
  switch(step.type){
    case 'title': html=scrTitle(); break;
    case 'howto': html=scrHowTo(); break;
    case 'prequiz': html=quizScreen('pre'); break;
    case 'intro': html=scrIntro(); break;
    case 'arc': html=scrArc(); break;
    case 'ending': html=scrEnding(); break;
    case 'today': html=scrToday(step); break;
    case 'reportcard': html=scrReport(); break;
    case 'action': html=scrAction(); break;
    case 'postquiz': html=quizScreen('post'); break;
    case 'sources': html=scrSources(); break;
  }
  const key = screenKey(step);
  app.innerHTML = html;
  updateTimerVisibility(step);
  if(key!==lastScreenKey){ lastScreenKey=key; window.scrollTo({top:0,behavior:'auto'}); }
}

function next(){
  const step = STEPS[state.i];
  if(step.type==='intro'){ state.i++; enterArc(); save(); render(); return; }
  if(step.type==='arc'){ arcAdvance(); return; }
  if(step.type==='ending'){ state.i = stepIndex('today'); save(); render(); return; }
  if(state.i < STEPS.length-1){ state.i++; save(); render(); }
}
function back(){
  const step = STEPS[state.i];
  if(step.type==='arc'){
    if(state.arcPos>0){ state.arcPos--; } else { state.i = stepIndex('intro'); }
    save(); render(); return;
  }
  if(step.type==='ending'){ state.i = stepIndex('arc'); save(); render(); return; }
  if(state.i > 0){ state.i--; save(); render(); }
}

/* ---------------------- ACTIONS ---------------------- */
function nodeCount(key){ return key[0]==='t' ? CONTENT.today.decisions[+key.slice(1)].choices.length : nodeById(key).choices.length; }
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  const {node,opt,phase,q} = el.dataset;
  switch(a){
    case 'next': next(); break;
    case 'back': back(); break;
    case 'restart': restart(); break;
    case 'toggle-presenter': setPresenter(!state.presenter); break;
    case 'timer-toggle': ptimerToggle(); break;
    case 'timer-reset': ptimerReset(); break;
    case 'choose':
      state.choices[node]=+opt;
      if(STEPS[state.i].type==='arc'){ state.arcHist = state.arcHist.slice(0, state.arcPos+1); }
      save(); render(); break;
    case 'vote-inc': { const v=getVotesNode(node, nodeCount(node)); v[+opt]++; if(STEPS[state.i].type==='arc'){ state.arcHist=state.arcHist.slice(0,state.arcPos+1); } save(); render(); break; }
    case 'vote-dec': { const v=getVotesNode(node, nodeCount(node)); v[+opt]=Math.max(0,v[+opt]-1); if(STEPS[state.i].type==='arc'){ state.arcHist=state.arcHist.slice(0,state.arcPos+1); } save(); render(); break; }
    case 'quiz-pick': { (phase==='post'?state.postSolo:state.preSolo)[q]=+opt; save(); render(); break; }
    case 'quiz-reveal': { state.reveal[phase] = !state.reveal[phase]; render(); break; }
    case 'quiz-inc': { quizHand(phase,q,+opt,+1); save(); render(); break; }
    case 'quiz-dec': { quizHand(phase,q,+opt,-1); save(); render(); break; }
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
  }
});

function quizHand(phase,qid,opt,delta){
  const store = phase==='post'?state.postHands:state.preHands;
  const q = CONTENT.quiz.find(x=>x.id===qid);
  if(!store[qid]) store[qid]=Array(q.options.length).fill(0);
  store[qid][opt]=Math.max(0, store[qid][opt]+delta);
}

/* ---------------------- KEYBOARD ---------------------- */
function decideInfo(step){
  if(step.type==='arc'){ const f=state.arcHist[state.arcPos]; if(!f || f.phase!=='decide') return null; return {key:f.node, count:nodeById(f.node).choices.length}; }
  if(step.type==='today' && step.phase==='decide'){ return {key:'t'+step.dec, count:CONTENT.today.decisions[step.dec].choices.length}; }
  return null;
}
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea')) return;
  if((e.key==='Enter'||e.key===' ') && e.target.closest && e.target.closest('button')) return;
  const step = STEPS[state.i];
  if(e.key==='p'||e.key==='P'){ setPresenter(!state.presenter); return; }
  if(e.key==='ArrowRight'){ tryNext(); return; }
  if(e.key==='ArrowLeft'){ back(); return; }
  if(e.key==='Enter'||e.key===' '){ tryNext(); e.preventDefault(); return; }
  const info = decideInfo(step);
  if(info && /^[1-9]$/.test(e.key)){
    const oi = +e.key-1; if(oi>=info.count) return;
    if(state.presenter){ const v=getVotesNode(info.key,info.count); v[oi]++; }
    else { state.choices[info.key]=oi; }
    if(step.type==='arc'){ state.arcHist = state.arcHist.slice(0, state.arcPos+1); }
    save(); render();
  }
});
function tryNext(){
  const step = STEPS[state.i];
  const info = decideInfo(step);
  if(info && !state.presenter && state.choices[info.key]==null) return;
  if(step.type==='prequiz'||step.type==='postquiz'){ if(!quizAnswered(step.type==='postquiz'?'post':'pre')) return; }
  next();
}

/* ---------------------- PRESENTER TOGGLE ---------------------- */
function setPresenter(on){
  state.presenter=on;
  document.body.classList.toggle('presenter',on);
  presenterBtn.textContent = 'Presenter mode: '+(on?'On':'Off');
  presenterBtn.classList.toggle('on',on);
  save(); render();
}

/* ---------------------- EXPORT ---------------------- */
function buildSummary(){
  const path = committedRevealFrames().map(f=>{
    const n=nodeById(f.node); const oi=chosenOpt(f.node); const c=n.choices[oi];
    return { node:f.node, year:n.year, chapter:n.chapter, chose:c.short, tag:c.outcome.tag, stability:c.stability||0 };
  });
  const today = CONTENT.today.decisions.map((d,di)=>{
    const key='t'+di; const p = state.presenter ? ((topVoteNode(key)||{}).idx) : state.choices[key];
    return { prompt:d.scenario.slice(0,70), chose: p!=null? d.choices[p].short : null };
  });
  const quiz = {
    solo: { pre: soloScore('pre'), post: soloScore('post'), outOf: CONTENT.quiz.length },
    presenter: { pre: handsPct('pre'), post: handsPct('post') }
  };
  return { title:CONTENT.meta.title, exportedAt:new Date().toISOString(), mode: state.presenter?'presenter':'solo',
    finalStability: stabilityClamped(), ending: state.ended? nodeById(state.ended).title : null, path, today, quiz };
}
function download(filename, text, type){
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function stamp(){ return new Date().toISOString().slice(0,16).replace(/[:T]/g,'-'); }
function exportJSON(){
  download(`unfinished-promise-results-${stamp()}.json`, JSON.stringify(buildSummary(),null,2), 'application/json');
}
function csvCell(s){ return '"'+String(s).replace(/"/g,'""')+'"'; }
function exportCSV(){
  const S = buildSummary(); const rows=[];
  rows.push(['Section','Moment','Chose','Type','Stability'].map(csvCell).join(','));
  S.path.forEach(p=> rows.push(['Arc', `${p.year} ${p.chapter}`, p.chose, p.tag==='real'?'real history':'counterfactual', p.stability].map(csvCell).join(',')));
  S.today.forEach((t,i)=> rows.push(['Today', `Today ${i+1}`, t.chose||'', '', ''].map(csvCell).join(',')));
  rows.push(['Summary','Final national stability', S.finalStability, 'ending', S.ending||''].map(csvCell).join(','));
  rows.push('');
  rows.push(['Section','Question','Phase','Answer','Correct?','Hands/Picked'].map(csvCell).join(','));
  CONTENT.quiz.forEach(q=>{
    ['pre','post'].forEach(phase=>{
      q.options.forEach((opt,oi)=>{
        let val='';
        if(state.presenter){ val = ((phase==='post'?state.postHands:state.preHands)[q.id]||[])[oi]||0; }
        else { val = ((phase==='post'?state.postSolo:state.preSolo)[q.id]===oi)?'picked':''; }
        rows.push(['Quiz', q.q, phase, opt, (oi===q.answer?'YES':''), val].map(csvCell).join(','));
      });
    });
  });
  if(state.presenter){ const pre=handsPct('pre'),post=handsPct('post'); rows.push(''); rows.push(['Summary','Class % correct','pre',pre.pct+'%','post',post.pct+'%'].map(csvCell).join(',')); }
  else { rows.push(''); rows.push(['Summary','Solo score','pre',soloScore('pre')+'/3','post',soloScore('post')+'/3'].map(csvCell).join(',')); }
  download(`unfinished-promise-results-${stamp()}.csv`, rows.join('\n'), 'text/csv');
}

/* ---------------------- PRESENTER TIMER (60s per decision) ---------------------- */
let ptimerEl=null, ptimerInterval=null, ptimerRemaining=60, ptimerRunning=false, ptimerLastKey=null;
function ptimerFmt(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function ptimerCreate(){
  if(ptimerEl || !document.createElement) return;
  const el = document.createElement('div');
  el.id='ptimer'; el.className='ptimer'; el.hidden=true;
  el.innerHTML = '<span id="ptimerDisplay">1:00</span>'
    + '<button id="ptimerToggle" class="btn ghost" data-action="timer-toggle">Start</button>'
    + '<button class="btn ghost" data-action="timer-reset">Reset</button>';
  if(document.body && document.body.appendChild) document.body.appendChild(el);
  ptimerEl = el;
}
function ptimerRender(){
  const d=document.getElementById('ptimerDisplay'); if(d) d.textContent=ptimerFmt(ptimerRemaining);
  const b=document.getElementById('ptimerToggle'); if(b) b.textContent=ptimerRunning?'Pause':'Start';
}
function ptimerClass(add){
  const p=document.getElementById('ptimer');
  if(p && p.classList && p.classList[add?'add':'remove']) p.classList[add?'add':'remove']('done');
}
function ptimerStop(){ ptimerRunning=false; if(ptimerInterval){ clearInterval(ptimerInterval); ptimerInterval=null; } ptimerRender(); }
function ptimerReset(){ ptimerStop(); ptimerRemaining=60; ptimerClass(false); ptimerRender(); }
function ptimerTick(){ if(ptimerRemaining>0){ ptimerRemaining--; ptimerRender(); if(ptimerRemaining===0){ ptimerStop(); ptimerClass(true); } } }
function ptimerStart(){ if(ptimerRunning) return; if(ptimerRemaining===0) ptimerReset(); ptimerRunning=true; ptimerInterval=setInterval(ptimerTick,1000); ptimerRender(); }
function ptimerToggle(){ ptimerRunning ? ptimerStop() : ptimerStart(); }
function updateTimerVisibility(step){
  const p=document.getElementById('ptimer'); if(!p) return;
  let key=null, isDecide=false;
  if(state.presenter && step){
    if(step.type==='arc'){ const f=state.arcHist[state.arcPos]; if(f && f.phase==='decide'){ isDecide=true; key='arc:'+f.node; } }
    else if(step.type==='today' && step.phase==='decide'){ isDecide=true; key='today:'+step.dec; }
  }
  p.hidden = !isDecide;
  if(isDecide){ if(key!==ptimerLastKey){ ptimerLastKey=key; ptimerReset(); } }
  else if(ptimerLastKey!==null){ ptimerLastKey=null; ptimerStop(); }
}

/* ---------------------- BOOT ---------------------- */
ptimerCreate();
load();
document.body.classList.toggle('presenter', state.presenter);
presenterBtn.textContent = 'Presenter mode: '+(state.presenter?'On':'Off');
presenterBtn.classList.toggle('on', state.presenter);
render();
</script>
