<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Unfinished Promise: A Civic Virtue Game</title>
<style>
  /* ============================================================
     THEME + LAYOUT (engine styling — safe to leave alone)
     Parchment tones, serif headings, high contrast for projector.
     ============================================================ */
  :root{
    --parchment:#f4ecd6;
    --parchment-2:#efe3c4;
    --card:#fbf6e7;
    --ink:#2a2118;
    --ink-soft:#5c4f3d;
    --accent:#7c2b23;      /* colonial red — headings, primary buttons */
    --accent-2:#5a3410;
    --madison:#254a70;     /* federalist blue */
    --madison-bg:#e7eef5;
    --brutus:#6b4a12;      /* anti-federalist brown/gold */
    --brutus-bg:#f3ead2;
    --good:#2f6b3c;        /* lived up */
    --good-bg:#e4f0e2;
    --bad:#9c3324;         /* fell short */
    --bad-bg:#f4e2dc;
    --neutral:#4a4636;
    --neutral-bg:#ece5cf;
    --border:#c9b487;
    --border-dark:#a8905f;
    --shadow:0 2px 0 rgba(90,52,16,.12), 0 6px 18px rgba(70,45,10,.10);
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --root-size:17px;
    --maxw:880px;
  }
  *{box-sizing:border-box;}
  html{font-size:var(--root-size);}
  body{
    margin:0;
    background:var(--parchment);
    background-image:radial-gradient(circle at 20% 10%, rgba(255,255,255,.35), transparent 40%),
                     radial-gradient(circle at 85% 90%, rgba(120,80,20,.06), transparent 45%);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.55;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:var(--serif);}
  a{color:var(--madison);}

  /* ---- top toolbar ---- */
  .toolbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:8px 16px;
    background:rgba(244,236,214,.94);
    border-bottom:1px solid var(--border);
    backdrop-filter:blur(4px);
  }
  .toolbar .brand{font-family:var(--serif);font-weight:700;color:var(--accent);margin-right:auto;font-size:1rem;letter-spacing:.3px;}
  .toolbar .brand small{display:block;font-family:var(--sans);font-weight:400;color:var(--ink-soft);font-size:.72rem;letter-spacing:0;}
  .tbtn{
    font-family:var(--sans);font-size:.82rem;
    background:var(--card);color:var(--ink);
    border:1px solid var(--border-dark);border-radius:8px;
    padding:6px 11px;cursor:pointer;white-space:nowrap;
  }
  .tbtn:hover{border-color:var(--accent);}
  .tbtn.on{background:var(--accent);color:#fdf6e6;border-color:var(--accent);font-weight:600;}

  /* ---- main stage ---- */
  .wrap{max-width:var(--maxw);margin:0 auto;padding:26px 16px 80px;}
  .screen{animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none;}}

  .eyebrow{font-family:var(--sans);text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;color:var(--accent);font-weight:700;}
  h1.title{font-size:clamp(2rem,6vw,3.2rem);line-height:1.05;margin:.2em 0 .1em;color:var(--accent);}
  h2{font-size:clamp(1.4rem,3.6vw,2rem);color:var(--accent-2);margin:.1em 0 .4em;}
  h3{font-size:1.15rem;margin:0 0 .3em;}
  p{margin:.5em 0;}
  .lede{font-size:1.12rem;color:var(--ink-soft);}
  .muted{color:var(--ink-soft);}
  .center{text-align:center;}

  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);margin:16px 0;
  }
  .panel{background:var(--parchment-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:12px 0;}

  /* progress */
  .progress{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:.8rem;color:var(--ink-soft);}
  .pips{display:flex;gap:5px;}
  .pip{width:26px;height:6px;border-radius:3px;background:var(--border);}
  .pip.done{background:var(--accent);}
  .pip.cur{background:var(--madison);}

  /* buttons */
  .btn{
    font-family:var(--sans);font-size:1rem;font-weight:600;
    background:var(--accent);color:#fdf6e6;border:none;border-radius:10px;
    padding:12px 22px;cursor:pointer;box-shadow:var(--shadow);
  }
  .btn:hover{filter:brightness(1.06);}
  .btn.secondary{background:var(--card);color:var(--ink);border:1px solid var(--border-dark);box-shadow:none;}
  .btn.ghost{background:transparent;color:var(--madison);border:1px solid var(--border-dark);box-shadow:none;font-weight:500;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:18px;}
  .spacer{flex:1;}

  /* advisor cards */
  .advisors{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0;}
  .advisor{border-radius:12px;padding:14px 16px;border:1px solid var(--border);}
  .advisor.madison{background:var(--madison-bg);border-color:#b9cbdd;}
  .advisor.brutus{background:var(--brutus-bg);border-color:#d8c391;}
  .advisor .who{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;}
  .advisor .name{font-family:var(--serif);font-weight:700;font-size:1.05rem;}
  .advisor.madison .name{color:var(--madison);}
  .advisor.brutus .name{color:var(--brutus);}
  .advisor .side{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);}
  .advisor blockquote{margin:0 0 8px;font-family:var(--serif);font-style:italic;font-size:1rem;line-height:1.5;border-left:3px solid currentColor;padding-left:10px;}
  .advisor.madison blockquote{color:var(--madison);}
  .advisor.brutus blockquote{color:var(--brutus);}
  .advisor .gloss{font-size:.92rem;color:var(--ink);}
  .advisor .src{font-size:.72rem;color:var(--ink-soft);margin-top:6px;}
  .advisor.morris{background:var(--brutus-bg);border-color:#d8c391;}
  .advisor.morris .name{color:var(--brutus);}
  .advisor.morris blockquote{color:var(--brutus);}

  /* choices */
  .choices{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .choice{
    text-align:left;width:100%;background:var(--card);border:1px solid var(--border-dark);
    border-radius:10px;padding:13px 15px;cursor:pointer;font-family:var(--sans);font-size:1rem;color:var(--ink);
    display:flex;gap:12px;align-items:flex-start;
  }
  .choice:hover{border-color:var(--accent);background:#fffdf4;}
  .choice .num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fdf6e6;display:grid;place-items:center;font-weight:700;font-size:.85rem;}
  .choice .ctext{flex:1;}
  .choice .cost{display:block;font-size:.85rem;color:var(--bad);margin-top:3px;}
  .choice.picked{border-color:var(--madison);background:#eef3f8;box-shadow:inset 0 0 0 1px var(--madison);}

  /* vote counters (presenter) */
  .voterow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border-dark);border-radius:10px;padding:10px 12px;}
  .voterow .ctext{flex:1;}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--border-dark);background:var(--parchment-2);font-size:1.2rem;font-weight:700;cursor:pointer;color:var(--ink);}
  .stepper button:hover{border-color:var(--accent);}
  .stepper .count{min-width:2ch;text-align:center;font-weight:700;font-size:1.15rem;font-family:var(--serif);}

  /* verdict badges */
  .badge{display:inline-block;font-weight:700;font-size:.8rem;padding:3px 10px;border-radius:999px;letter-spacing:.03em;}
  .badge.up{background:var(--good-bg);color:var(--good);border:1px solid var(--good);}
  .badge.short{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);}
  .badge.neutral{background:var(--neutral-bg);color:var(--neutral);border:1px solid var(--border-dark);}

  .outcome{border-left:5px solid var(--border-dark);}
  .outcome.up{border-left-color:var(--good);}
  .outcome.short{border-left-color:var(--bad);}
  .outcome .why{font-style:italic;color:var(--ink-soft);margin-top:8px;}

  /* quiz */
  .q{margin:14px 0;}
  .q .qtext{font-weight:600;margin-bottom:8px;}
  .opt{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--border-dark);border-radius:9px;margin:6px 0;cursor:pointer;background:var(--card);}
  .opt:hover{border-color:var(--accent);}
  .opt.picked{border-color:var(--madison);background:#eef3f8;box-shadow:inset 0 0 0 1px var(--madison);}
  .opt .letter{flex:none;width:24px;height:24px;border-radius:6px;background:var(--parchment-2);display:grid;place-items:center;font-weight:700;font-size:.8rem;}
  .opt.correct{border-color:var(--good);background:var(--good-bg);}
  .opt.wrong{border-color:var(--bad);background:var(--bad-bg);}

  /* report card table */
  .rc{width:100%;border-collapse:collapse;margin-top:10px;}
  .rc th,.rc td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top;}
  .rc th{font-family:var(--serif);color:var(--accent-2);font-size:.95rem;}
  .rc td .yr{font-family:var(--serif);font-weight:700;color:var(--accent);}
  .rc td ul{margin:4px 0 0;padding-left:18px;}
  .rc td li{font-size:.92rem;}

  .scorebig{font-family:var(--serif);font-size:2.4rem;color:var(--accent);font-weight:700;}
  .scorewrap{display:flex;gap:26px;flex-wrap:wrap;align-items:center;justify-content:center;margin:10px 0;}
  .scorewrap .arrow{font-size:2rem;color:var(--ink-soft);}
  .delta{font-weight:700;}
  .delta.pos{color:var(--good);}
  .delta.neg{color:var(--bad);}

  /* action + sources */
  .action{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px dashed var(--border);}
  .action .n{flex:none;width:34px;height:34px;border-radius:50%;background:var(--madison);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-weight:700;}
  .action .abody{flex:1;}
  .action a{font-weight:600;}
  .srcgroup{margin:14px 0;}
  .srcgroup li{margin:8px 0;font-size:.95rem;}

  .kbd{font-family:var(--sans);font-size:.72rem;background:var(--parchment-2);border:1px solid var(--border-dark);border-radius:5px;padding:1px 6px;}
  .hint{font-size:.82rem;color:var(--ink-soft);margin-top:8px;}
  .flag{background:#fff6d6;border:1px dashed var(--border-dark);border-radius:8px;padding:8px 10px;font-size:.82rem;color:var(--accent-2);margin:10px 0;}

  /* mobile */
  @media (max-width:640px){
    .advisors{grid-template-columns:1fr;}
    .wrap{padding:20px 14px 70px;}
    .toolbar .brand small{display:none;}
  }

  /* ---- PRESENTER MODE: big type, roomy, projector-friendly ---- */
  body.presenter{--root-size:22px;--maxw:1080px;}
  body.presenter .lede{font-size:1.25rem;}
  body.presenter .advisor blockquote{font-size:1.15rem;}
  body.presenter .btn{padding:14px 28px;font-size:1.1rem;}
  body.presenter .hint.solo-only{display:none;}
  body.presenter .presenter-only{display:block;}
  .presenter-only{display:none;}
  body:not(.presenter) .presenter-only{display:none;}

  /* ================================================================
     PER-ERA VISUAL THEMING  —  RADICAL / IMMERSIVE  (driven by
     the <body data-era="…"> attribute set in render()).
     Each era RE-STAGES the whole page: the body is the "surround"
     (desk / poster wall / newsprint / app background) and .wrap is
     the "artifact" (parchment sheet / poster / newspaper page / app
     panel), with its own toolbar skin, headings, buttons and cards.
     STILL CONSTANT so nothing breaks: layout skeleton, spacing,
     --root-size, --maxw, body.presenter (big-type), the mobile
     stacking, and character/verdict identity tokens
     (--madison,--brutus,--good,--bad and their -bg).
     All offline: web-safe fonts + pure-CSS textures only.
     ================================================================ */

  body{transition:background-color .5s ease, color .5s ease;}
  .wrap{transition:background-color .5s ease, border-color .5s ease, box-shadow .5s ease;}

  /* ============ 1787 · FOUNDING — aged manuscript on a desk ============ */
  body[data-era="founding"]{
    --parchment:#ECE3CE; --parchment-2:#E7D9B8; --card:#F6EFDC;
    --ink:#2B2016; --ink-soft:#5c4a32;
    --accent:#7A2E24; --accent-2:#1F3A5F;
    --border:#C2AC7E; --border-dark:#9c8659;
    --serif:"Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
    --sans:Georgia,"Times New Roman",serif;
    background:#2c1f12;
    background-image:
      radial-gradient(120% 90% at 50% 0%, #4a3620 0%, #2c1f12 60%, #1f1509 100%),
      repeating-linear-gradient(90deg, rgba(0,0,0,.10) 0 3px, transparent 3px 9px);
  }
  body[data-era="founding"] .wrap{
    position:relative;
    background:#f3e8cf;
    background-image:
      radial-gradient(circle at 50% 0%, rgba(255,250,235,.75), transparent 60%),
      repeating-linear-gradient(0deg, rgba(60,45,25,.045) 0 1px, transparent 1px 5px);
    border:1px solid #b89b6a;
    box-shadow:0 22px 55px rgba(0,0,0,.55), inset 0 0 70px rgba(120,90,50,.14);
    padding:36px 30px 66px; margin:22px auto 44px; border-radius:2px;
  }
  body[data-era="founding"] .wrap::before{
    content:""; position:absolute; inset:14px;
    border:2px double #8a6a3a; pointer-events:none;
  }
  body[data-era="founding"] .toolbar{background:rgba(38,26,15,.94);border-bottom:1px solid #6b4f2c;}
  body[data-era="founding"] .toolbar .brand{color:#ecd6a8;}
  body[data-era="founding"] .toolbar .brand small{color:#c3a878;}
  body[data-era="founding"] .tbtn{background:#48351f;color:#f0e2c6;border-color:#6b4f2c;}
  body[data-era="founding"] .tbtn.on{background:var(--accent);border-color:var(--accent);}
  body[data-era="founding"] h1.title,
  body[data-era="founding"] h2,
  body[data-era="founding"] h3{
    font-variant:small-caps; letter-spacing:.02em;
    text-shadow:0 1px 0 rgba(255,251,240,.75), 0 -1px 0 rgba(43,32,22,.2);
  }
  body[data-era="founding"] h2{border-bottom:3px double var(--accent);padding-bottom:.12em;}
  body[data-era="founding"] .eyebrow{display:block;text-align:center;letter-spacing:.26em;color:var(--accent);}
  body[data-era="founding"] .eyebrow::before{content:"\275E   ";}
  body[data-era="founding"] .eyebrow::after{content:"   \275E";}
  body[data-era="founding"] .card .lede::first-letter{
    font-size:3.1em; float:left; line-height:.72; padding:.06em .12em 0 0;
    color:var(--accent); font-family:var(--serif); font-weight:700;
  }
  body[data-era="founding"] .card,
  body[data-era="founding"] .choice{border-radius:0;}
  body[data-era="founding"] .btn{border-radius:0;font-variant:small-caps;letter-spacing:.05em;}
  body[data-era="founding"] .btn:not(.secondary):not(.ghost){
    border:1px solid #45170f; box-shadow:0 2px 0 #45170f;
  }

  /* ============ 1942 · HOME FRONT — WWII propaganda poster ============ */
  body[data-era="homefront"]{
    --parchment:#E4DCC8; --parchment-2:#D8CDB0; --card:#F4EEDF;
    --ink:#161616; --ink-soft:#454545;
    --accent:#C1272D; --accent-2:#1C3F71;
    --border:#161616; --border-dark:#161616;
    --serif:"Arial Narrow",Impact,"Haettenschweiler","Segoe UI Condensed","Segoe UI",sans-serif;
    --sans:Georgia,"Times New Roman",serif;
    background:#b3231f;
    background-image:repeating-linear-gradient(45deg, rgba(0,0,0,.07) 0 20px, transparent 20px 40px);
  }
  body[data-era="homefront"] .wrap{
    background:#f4eedf;
    background-image:radial-gradient(rgba(20,20,20,.09) .7px, transparent 1.1px);
    background-size:4px 4px;
    border:7px solid #1C3F71; box-shadow:0 16px 44px rgba(0,0,0,.5);
    padding:26px 26px 60px; margin:20px auto 44px; border-radius:0;
  }
  body[data-era="homefront"] .wrap::before{
    content:""; display:block; height:12px; margin:-26px -26px 20px;
    background:#C1272D;
  }
  body[data-era="homefront"] .toolbar{background:#1C3F71;border-bottom:5px solid #C1272D;}
  body[data-era="homefront"] .toolbar .brand{color:#fff;}
  body[data-era="homefront"] .toolbar .brand small{color:#cfdaea;}
  body[data-era="homefront"] .tbtn{background:#14305a;color:#fff;border-color:#0e2340;}
  body[data-era="homefront"] .tbtn.on{background:#C1272D;border-color:#C1272D;}
  body[data-era="homefront"] h1.title{font-size:clamp(2.6rem,9vw,4.6rem);line-height:.9;color:#161616;}
  body[data-era="homefront"] h1.title,
  body[data-era="homefront"] h2,
  body[data-era="homefront"] h3{text-transform:uppercase;letter-spacing:.02em;font-weight:700;}
  body[data-era="homefront"] h2{
    font-size:clamp(1.6rem,5vw,2.5rem);line-height:1.02;color:#161616;
    border-bottom:6px solid var(--accent);padding-bottom:.06em;display:inline-block;
  }
  body[data-era="homefront"] .eyebrow{
    display:inline-block;background:var(--accent);color:#fff;
    padding:5px 14px;letter-spacing:.16em;box-shadow:0 4px 0 #1C3F71;
  }
  body[data-era="homefront"] .card{border-radius:0;border:2px solid var(--border);}
  body[data-era="homefront"] .advisor{border-radius:0;border:2px solid #161616;}
  body[data-era="homefront"] .choice{border-radius:0;border:2px solid #161616;}
  body[data-era="homefront"] .choice .num{border-radius:0;background:var(--accent-2);}
  body[data-era="homefront"] .btn{border-radius:0;text-transform:uppercase;letter-spacing:.06em;}
  body[data-era="homefront"] .btn:not(.secondary):not(.ghost){
    background:var(--accent);color:#fff;border:3px solid #161616;box-shadow:5px 5px 0 #161616;
  }

  /* ============ 1974 · WATERGATE — newspaper front page ============ */
  body[data-era="watergate"]{
    --parchment:#DAD4C3; --parchment-2:#CFC7B0; --card:#EFE9DA;
    --ink:#201C16; --ink-soft:#5a5140;
    --accent:#B0400F; --accent-2:#8a6608;
    --border:#7C6F52; --border-dark:#5f5540;
    --serif:"Times New Roman",Georgia,serif;
    --sans:Georgia,"Times New Roman",serif;
    background:#8f886f;
    background-image:radial-gradient(120% 80% at 50% 0%, #a49b80, #7d765f);
  }
  body[data-era="watergate"] .wrap{
    background:#f4efe0;
    background-image:
      radial-gradient(circle at 85% 90%, rgba(60,50,30,.06), transparent 50%),
      linear-gradient(rgba(90,80,55,.035), rgba(90,80,55,.035));
    border:1px solid #201C16; box-shadow:0 14px 44px rgba(0,0,0,.45);
    padding:0 26px 60px; margin:20px auto 44px; border-radius:0;
  }
  /* masthead nameplate (fictional paper) */
  body[data-era="watergate"] .wrap::before{
    content:"The Civic Record"; display:block; text-align:center;
    font-family:"Times New Roman",Georgia,serif; font-weight:700;
    font-size:clamp(2rem,7vw,3.4rem); letter-spacing:.01em;
    padding:16px 8px 8px; margin:0 -26px 6px;
    border-bottom:4px double #201C16;
  }
  body[data-era="watergate"] .toolbar{background:#201C16;border-bottom:1px solid #000;}
  body[data-era="watergate"] .toolbar .brand{color:#e6d9bd;}
  body[data-era="watergate"] .toolbar .brand small{color:#b7ab8d;}
  body[data-era="watergate"] .tbtn{background:#342d22;color:#efe6d5;border-color:#5f5540;}
  body[data-era="watergate"] .tbtn.on{background:var(--accent);border-color:var(--accent);}
  body[data-era="watergate"] h2{
    font-size:clamp(1.7rem,5vw,2.7rem); text-align:center; font-weight:700;
    border-top:3px solid var(--ink); border-bottom:3px double var(--ink);
    padding:.12em 0; text-transform:uppercase; letter-spacing:.01em;
  }
  body[data-era="watergate"] .eyebrow{
    display:block;text-align:center;text-transform:uppercase;color:var(--accent);
    font-weight:700;letter-spacing:.18em;
  }
  body[data-era="watergate"] .card p{text-align:justify;}
  body[data-era="watergate"] .card{border-radius:2px;}
  /* leaked-memo typewriter scenario */
  body[data-era="watergate"] .card .lede{
    font-family:"Courier New",Courier,monospace; text-align:left;
    border-left:4px solid var(--accent); padding-left:.8em;
  }
  body[data-era="watergate"] .btn{border-radius:0;text-transform:uppercase;letter-spacing:.05em;}
  body[data-era="watergate"] .btn:not(.secondary):not(.ghost){background:var(--ink);color:#f4efe0;}

  /* ============ TODAY — sleek modern civic app ============ */
  body[data-era="today"]{
    --parchment:#EEF1F4; --parchment-2:#E4E9EF; --card:#FFFFFF;
    --ink:#1B1B1B; --ink-soft:#54606d;
    --accent:#005EA2; --accent-2:#D83933;
    --border:#E3E7EC; --border-dark:#c7ced6;
    --serif:"Segoe UI",system-ui,"Trebuchet MS",sans-serif;
    --sans:system-ui,"Segoe UI",Arial,sans-serif;
    background:#e9edf2;
    background-image:
      radial-gradient(circle at 100% 0%, rgba(0,94,162,.07), transparent 42%),
      radial-gradient(circle at 0% 100%, rgba(216,57,51,.05), transparent 40%);
  }
  body[data-era="today"] .wrap{
    background:#fff; border:1px solid #e3e7ec; border-top:6px solid var(--accent);
    border-radius:16px; box-shadow:0 12px 44px rgba(20,40,80,.12);
    padding:28px 26px 60px; margin:22px auto 44px;
  }
  body[data-era="today"] .toolbar{background:rgba(255,255,255,.95);border-bottom:1px solid #e3e7ec;}
  body[data-era="today"] .toolbar .brand{color:var(--accent);}
  body[data-era="today"] h1.title,
  body[data-era="today"] h2,
  body[data-era="today"] h3{letter-spacing:-.01em;font-weight:700;}
  body[data-era="today"] .eyebrow{
    display:inline-block;background:rgba(0,94,162,.1);color:var(--accent);
    padding:4px 12px;border-radius:999px;letter-spacing:.08em;
  }
  body[data-era="today"] .card{
    border-radius:12px; border:1px solid var(--border); border-top:4px solid var(--accent);
    box-shadow:0 1px 2px rgba(27,27,27,.06), 0 6px 18px rgba(20,40,80,.06);
  }
  body[data-era="today"] .advisor{border-radius:12px;}
  body[data-era="today"] .choice{border-radius:12px;}
  body[data-era="today"] .btn{border-radius:999px;}
  body[data-era="today"] .btn:not(.secondary):not(.ghost){box-shadow:0 3px 10px rgba(0,94,162,.32);}
  body[data-era="today"] a:focus-visible,
  body[data-era="today"] button:focus-visible{outline:3px solid #FFBE2E;outline-offset:2px;}

  /* keep the dramatic frames comfortable on phones */
  @media (max-width:640px){
    body[data-era="founding"] .wrap{padding:24px 18px 54px;}
    body[data-era="founding"] .wrap::before{inset:9px;}
    body[data-era="homefront"] .wrap{border-width:4px;padding:20px 18px 54px;}
    body[data-era="homefront"] .wrap::before{margin:-20px -18px 16px;}
    body[data-era="watergate"] .wrap{padding:0 16px 54px;}
    body[data-era="watergate"] .wrap::before{margin:0 -16px 6px;}
    body[data-era="today"] .wrap{padding:22px 16px 54px;}
  }

  /* honor reduced-motion for the era transitions too */
  @media (prefers-reduced-motion:reduce){body,.wrap{transition:none;}}

  /* ---- branching feature: stability meter, real/counterfactual tags, endings ---- */
  .stability{margin:2px 0 16px;}
  .stability .top{display:flex;justify-content:space-between;align-items:baseline;font-size:.82rem;margin-bottom:5px;}
  .stability .label{font-weight:700;letter-spacing:.02em;}
  .stability .track{height:14px;border:1px solid var(--border-dark);border-radius:999px;background:var(--parchment-2);overflow:hidden;}
  .stability .fill{height:100%;border-radius:999px;transition:width .5s ease, background-color .5s ease;}
  .delta-note{font-size:.85rem;font-weight:700;margin:2px 0 6px;}
  .delta-note.pos{color:var(--good);} .delta-note.neg{color:var(--bad);}
  .tag{display:inline-block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 9px;border-radius:999px;vertical-align:middle;}
  .tag.real{background:var(--good-bg);color:var(--good);border:1px solid var(--good);}
  .tag.cf{background:#efe6d0;color:var(--accent-2);border:1px solid var(--border-dark);}
  .ending{text-align:center;padding-top:2vh;}
  .ending .big{font-family:var(--serif);font-size:clamp(1.9rem,6vw,3.1rem);line-height:1.05;margin:.15em 0 .3em;color:var(--accent);}
  .ending.collapse .big{color:var(--bad);}
  .ending .card,.ending .stability{text-align:left;}
  .pathlist{list-style:none;padding:0;margin:6px 0 0;}
  .pathlist li{padding:8px 0;border-bottom:1px solid var(--border);}
  .pathlist li:last-child{border-bottom:none;}
</style>
</head>
<body data-era="founding">
  <div class="toolbar">
    <div class="brand">The Unfinished Promise
      <small>Justice and equality, from the Declaration to the Constitution</small>
    </div>
    <button class="tbtn" id="presenterBtn" data-action="toggle-presenter">Presenter mode: Off</button>
    <button class="tbtn" data-action="export-csv" title="Download vote &amp; quiz tallies as CSV">Export CSV</button>
    <button class="tbtn" data-action="export-json" title="Download vote &amp; quiz tallies as JSON">Export JSON</button>
    <button class="tbtn" data-action="restart" title="Restart from the title screen">Restart</button>
  </div>
  <div class="wrap"><div id="app"></div></div>

<script>
/* ================================================================
   ===============   EDIT CONTENT HERE   ==========================
   Everything a writer might change lives in CONTENT and QUOTES.
   The game ENGINE is farther down and does not need to be touched.

   Content rules honored here:
   - Every Morris/Madison quote below is the EXACT text of its source
     (see the Sources page). Do NOT paraphrase inside quotation marks.
   - "What really happened" screens are 3–4 sentences.
   ================================================================ */

/* Verbatim quote bank. Advisors reference these by key so a quote is
   written once and reused correctly. (source shown on cards + Sources page) */
const QUOTES = {
  morris: { // Gouverneur Morris: wrote the Constitution's final wording; the Convention's leading anti-slavery voice
    curse:   "He never would concur in upholding domestic slavery. It was a nefarious institution. It was the curse of Heaven on the States where it prevailed.",
    justice: "We the People of the United States, in Order to form a more perfect Union, establish Justice… do ordain and establish this Constitution for the United States of America."
  },
  madison: { // James Madison: Federalist 10 & 51, drafted the Bill of Rights
    majority:   "Measures are too often decided, not according to the rules of justice and the rights of the minor party, but by the superior force of an interested and overbearing majority.",
    endofgov:   "Justice is the end of government. It is the end of civil society.",
    property:   "…wrong to admit in the Constitution the idea that there could be property in men.",
    dueprocess: "No person shall… be deprived of life, liberty, or property, without due process of law."
  }
};

const CONTENT = {
  meta: {
    title: "The Unfinished Promise",
    hook: "It is 1776 and you are in the room. Every choice you make from here to 1954 will change what happens next, and the meter at the top of the screen will track how close the country gets to the thing it said it believed.",
    virtue: "Justice",
    sub: "The game stops at real turning points between 1776 and 1954, and everything in it comes back to two documents, the Declaration of Independence and the Constitution."
  },

  intro: {
    what: "For this project, <strong>justice</strong> is something you do over and over, and it is to push laws and institutions towards treating people as <strong>equals</strong>. The Declaration said \"all men are created equal\" in 1776, at a time when about one in five people in the colonies were enslaved. So the promise was already broken on the same day it was made, and each decision in this game asks whether you will hold the country to it, anyway.",
    setup: [
      ["Gouverneur Morris, a Pennsylvania delegate who wrote the final wording of the Constitution", "morris", "Morris gave the harshest speech against slavery at the Convention, where he said he would rather pay a tax to buy freedom for every enslaved person in the country than saddle the next generation with a Constitution that protected it. He will usually tell you to deal with the injustice now, even if it costs you the deal."],
      ["James Madison, a Virginia delegate who wrote Federalist 10 and 51 and drafted the Bill of Rights", "madison", "Madison is the complicated one. He enslaved more than a hundred people at Montpelier over his life and never freed them, and he is also the delegate who said it was wrong to put the idea of property in men into the Constitution. He will usually tell you to protect the minority through the system and keep the Union together, but still wait."]
    ],
    vdscv: [
      ["V (Value)", "The value is equality, which is to have everyone have their standing and be protected by the law the same."],
      ["D (Danger)", "The danger is that the powerful, or just a big enough majority, decides that some people don't count, which is how you get slavery, segregation, and people turned away from the polls."],
      ["S (Solution)", "The founders started with the words \"all men are created equal,\" and every generation after them used the Constitution, the courts, and amendments to make those words apply to more people."],
      ["CV (Civic Virtue)", "The civic virtue is justice, which is the habit of noticing when the promise leaves someone out and pushing until it doesn't."]
    ]
  },

  /* 3 questions. The same set is used for the pre-quiz and the post-quiz. */
  quiz: [
    {
      id:"q1",
      q:"What does the Declaration of Independence say about people?",
      options:[
        "That only landowners have rights.",
        "That all men are created equal, with certain unalienable rights.",
        "That the king decides who is equal.",
        "That equality is granted by Congress."
      ],
      answer:1
    },
    {
      id:"q2",
      q:"What was the founding-era contradiction with \"all men are created equal\"?",
      options:[
        "The colonies had no written laws.",
        "Only the Supreme Court could define equality.",
        "The nation proclaimed equality while slavery continued and many people were excluded.",
        "There were no elections at all."
      ],
      answer:2
    },
    {
      id:"q3",
      q:"Which 1954 Supreme Court case struck down \"separate but equal\" and advanced equal justice?",
      options:[
        "Plessy v. Ferguson.",
        "Dred Scott v. Sandford.",
        "Korematsu v. United States.",
        "Brown v. Board of Education."
      ],
      answer:3
    }
  ],

  /* ============================================================
     BRANCHING STORY GRAPH (Chapters 1–3). Each choice has its own
     outcome. tag:"real" = what actually happened; tag:"cf" = an
     evidence-based estimate of a path not taken (see Sources).
     `stability` is the delta to National Stability (start 70).
     `next` = the id of the next node, "end_arc" (resolve an ending
     tier by stability), or "end_collapse" (force the losing ending).
     ============================================================ */
  story: {
    start: "n_decl",
    startStability: 70,
    collapseAt: 0,
    tiers: [ {min:80, id:"end_endures"}, {min:45, id:"end_fragile"}, {min:1, id:"end_falters"} ],
    nodes: {

      /* ---------- CHAPTER 1 · 1776 · THE PROMISE ---------- */
      "n_decl": {
        era:"founding", year:"1776", chapter:"The Promise",
        subtitle:"Jefferson's draft has a paragraph the South will not sign.",
        scenario:"Jefferson's draft of the Declaration blames King George for the slave trade, and calls it \"cruel war against human nature itself.\" South Carolina and Georgia want this paragraph gone, and some northern delegates are not arguing for it very ardently, since ships from their own colonies had been delivering enslaved people for years. What will you push for?",
        advisors:{
          morris:{ key:"curse", gloss:"If the first document this country signs calls slavery a war on human nature, every law that comes after it has to answer to that line." },
          madison:{ key:"property", gloss:"The British are landing on Staten Island this same week, and losing two colonies in current events could end the whole thing before it starts." }
        },
        choices:[
          { short:"Keep the anti-slavery passage", label:"Keep Jefferson's attack on the slave trade in the Declaration, even if the South walks away.", cost:"South Carolina and Georgia may not sign, in the same summer as the British army is landing in New York.", stability:12, flags:["idealism"], next:"n_const",
            outcome:{ tag:"cf", text:"Nobody can know exactly how it goes, but the risk was real. South Carolina voted against independence on July 1 and only switched to yes on July 2, so the colony was already very nearly on board. Keeping the paragraph probably costs you that vote, and a Declaration from eleven colonies would have looked a lot weaker to France, whose help the war depended on.", why:"The line would have been braver than what we got, but it only matters if there is a country around to be held to it." } },
          { short:"Cut the passage to keep the union", label:"Cut the attack on the slave trade so all thirteen colonies sign, but keep \"all men are created equal.\"", cost:"The country gets founded on a promise it breaks for about half a million people on the same day.", stability:-8, flags:["contradiction"], next:"n_const",
            outcome:{ tag:"real", text:"Congress cut the paragraph. Jefferson wrote years later that it was struck out \"in complaisance to South Carolina and Georgia,\" and he admitted the northern delegates \"felt a little tender\" about it too, because their ships had been \"pretty considerable carriers\" of enslaved people. The Declaration went out with \"all men are created equal\" still in it, and slavery went on in all thirteen colonies.", why:"In 1852 Frederick Douglass asked a crowd in Rochester, \"What, to the American slave, is your 4th of July?\" and this cut is a big part of why he had to ask." } },
          { short:"Water it down", label:"Keep a vague line about equality but drop any direct attack on slavery, so that nobody is offended.", cost:"You weaken the promise before anyone has even signed it.", stability:-6, flags:["vague"], next:"n_const",
            outcome:{ tag:"cf", text:"A vaguer Declaration avoids the fight in 1776 and loses it later. Abolitionists quoted \"all men are created equal\" for almost ninety years, and in 1848 the women at Seneca Falls rewrote it as \"all men and women are created equal.\" A softer line gives every one of those people less to stand on.", why:"The blunt wording is the part later movements could actually use, so watering it down hurts people who weren't even born yet." } }
        ]
      },

      /* ---------- CHAPTER 2 · 1787 · THE CONSTITUTION ---------- */
      "n_const": {
        era:"founding", year:"1787", chapter:"The Compromise",
        subtitle:"The Convention has to decide how slavery fits into the new government.",
        scenario:"It is August 1787 in Philadelphia. The delegates are still fighting over whether to count enslaved people for seats in Congress and whether Congress will ever be allowed to ban the slave trade. On August 8, Gouverneur Morris stands up and calls slavery \"the curse of Heaven on the States where it prevailed.\" What will you back?",
        advisors:{
          morris:{ key:"curse", gloss:"Counting enslaved people for representation rewards the states that hold them, because the more people a state enslaves, the more power it gets in Congress." },
          madison:{ key:"property", gloss:"I still believe that, but I would rather have a flawed Union than no Union at all, and I am not sure we get one if we force this now." }
        },
        choices:[
          { short:"Push to end slavery now", label:"Use the Constitution to start ending slavery, no matter what it does to the deal.", cost:"Georgia and the Carolinas may walk out, and there might not be a Union to ratify.", stability:12, flags:["abolition"], next:"n_const_abolition",
            outcome:{ tag:"cf", text:"The Deep South delegates said it outright. On August 21, John Rutledge of South Carolina told the Convention the real question was whether the southern states would be \"parties to the Union\" at all. Forcing abolition most likely ends the Convention, which means the Constitution that was later amended to end slavery never gets written.", why:"The 13th Amendment ended slavery in 1865 by changing the Constitution, so the Constitution had to exist first." } },
          { short:"Accept the compromises", label:"Accept the three-fifths clause and the slave trade protections so that every state ratifies.", cost:"The Constitution ends up protecting slavery without ever using the word, and it locks that protection in for decades.", stability:-10, flags:["compromise"], next:"n_14th",
            outcome:{ tag:"real", text:"The Convention took both deals. Enslaved people were counted as three-fifths of a person when seats in the House were handed out, and Article I, Section 9 blocked Congress from banning the slave trade until 1808. The word \"slavery\" does not appear anywhere in the text, but the protections were written in anyway.", why:"The three-fifths clause gave slave states extra seats in the House and extra electoral votes, and historians point out that Jefferson might have lost the election of 1800 without them." } },
          { short:"Ban the trade, keep the rest", label:"Ban the Atlantic slave trade right away, but leave slavery itself to the states.", cost:"You stop the ships, but everyone already enslaved stays enslaved.", stability:-4, flags:["tradeban"], next:"n_14th",
            outcome:{ tag:"cf", text:"Congress did ban the Atlantic trade eventually, on January 1, 1808, which was the first day the Constitution allowed it. Doing it in 1787 would have kept out tens of thousands of people who were brought over in those twenty years. Slavery inside the country would still have kept growing, though, because banning imports did nothing for the people already here or their children.", why:"Stopping the ships does not free anybody who is already enslaved, so this choice only moves the meter slightly." } }
        ]
      },

      "n_const_abolition": {
        era:"founding", year:"1787", chapter:"The Union in the Balance",
        subtitle:"The Deep South delegates are packing up.",
        scenario:"You pushed for abolition and the Convention is coming apart. The Georgia and South Carolina delegates are talking about going home, and the delegates from the middle states keep asking you to find something the South will accept. What now?",
        advisors:{
          morris:{ key:"curse", gloss:"A smaller Union without slavery still would be a free country, and I would take that over a big one built on \"the curse of Heaven.\"" },
          madison:{ key:"majority", gloss:"You can win the argument by \"the superior force of an interested and overbearing majority\" and still lose the Union you need to enforce it later." }
        },
        choices:[
          { short:"Hold firm, no Union with slavery", label:"Refuse to give in, and if the South leaves, let it leave.", cost:"You might end up with two countries on one coast, one slave and one free.", stability:-6, flags:["rupture"], next:"n_14th",
            outcome:{ tag:"cf", text:"Most historians doubt Georgia and the Carolinas would have joined an antislavery Union in 1787. The likelier result is a separate southern country that could push slavery west with no federal government to stop it. Your stand is honest. It could also leave enslaved people in the South with nobody outside their own state able to help them.", why:"The right position and the position that helps the most people weren't the same here, and that happens more often than anyone wants." } },
          { short:"Win a gradual abolition clause", label:"Trade for a deal that at least commits the country to ending slavery over time.", cost:"\"Gradual\" can take a whole lifetime for the person who is waiting.", stability:8, flags:["gradual"], next:"n_14th",
            outcome:{ tag:"cf", text:"This wasn't an imaginary idea, since Pennsylvania had already passed a gradual abolition law in 1780. Under that law, though, children born to enslaved mothers could still be held until they turned 28, and people in Pennsylvania were still listed as enslaved in the census decades later. A national version would probably have worked the same slow way.", why:"The date written into a law like this matters as much as the promise, because every year of delay is a year someone spends enslaved." } },
          { short:"Cave entirely", label:"Give up and accept whatever the South demands so that the Convention survives.", cost:"You end up worse off than the real compromise, with slavery protected even more.", stability:-16, flags:["cave"], next:"n_14th",
            outcome:{ tag:"cf", text:"Giving the South everything gets you a Constitution with even stronger protections than the real one, maybe with the slave trade protected forever instead of until 1808. The real deal in 1787 was already bad for enslaved people. This one's worse, and it would have been harder to undo later.", why:"Every protection added in 1787 was another thing somebody in 1865 had to tear out." } }
        ]
      },

      /* ---------- CHAPTER 3 · 1868 · EQUAL PROTECTION ---------- */
      "n_14th": {
        era:"watergate", year:"1868", chapter:"Equal Protection",
        subtitle:"Slavery is over, and the question now is what freedom actually means.",
        scenario:"The Civil War ended in 1865, and the 13th Amendment abolished slavery that same year. Now the 14th Amendment would promise every citizen \"the equal protection of the laws.\" Writing that down is the easy part. Making it true in Mississippi or Louisiana will take federal troops, federal courts, and years of the North paying attention. What will you commit to?",
        advisors:{
          morris:{ key:"justice", gloss:"The Preamble says this government exists to \"establish Justice,\" and that job is not finished so long as freed people can be beaten for trying to vote." },
          madison:{ key:"endofgov", gloss:"If a government will not protect the rights of the people it just freed, I am not sure what it thinks it is for." }
        },
        choices:[
          { short:"Ratify and enforce it", label:"Ratify the 14th Amendment and back it up with federal enforcement of Black citizenship and voting rights.", cost:"It means a long and expensive federal presence in the South, along with fierce and sometimes violent pushback.", stability:14, flags:["reconstruction"], next:"n_brown",
            outcome:{ tag:"cf", text:"Where the troops stayed, it worked for a while. Black men voted in large numbers, Mississippi sent Hiram Revels to the U.S. Senate in 1870, and hundreds of Black officials served in Southern state governments. Keeping that enforcement going past 1877 could have kept Black Southerners voting through the 1890s and after, instead of watching it get taken away.", why:"After Blanche Bruce of Mississippi left the Senate in 1881, no Black senator represented a Southern state again until 2013." } },
          { short:"Ratify, but leave it to the states", label:"Pass the Amendment, pull the federal troops out, and trust the states to honor it.", cost:"With nobody enforcing it, the promise gets gutted anywhere the majority pushes back.", stability:-6, flags:["jimcrow"], next:"n_reconstruction_fails",
            outcome:{ tag:"real", text:"This is close to what actually happened. The 14th Amendment was ratified in July 1868, but after the disputed election of 1876, the Compromise of 1877 pulled the last federal troops out of the South. Within about twenty years Southern states had poll taxes, literacy tests, and segregation laws, all while the amendment sat in the Constitution unchanged.", why:"Mississippi rewrote its state constitution in 1890 with a poll tax and a literacy test aimed at Black voters, and other Southern states copied it within a few years." } },
          { short:"Restore the old order", label:"Give up on Reconstruction and let the pre-war leaders run the South again so the fighting ends.", cost:"You trade equality for \"peace\" and hand power back to the people who denied it.", stability:-20, flags:["redemption"], next:"end_collapse",
            outcome:{ tag:"cf", text:"Southern white Democrats called taking back power \"Redemption,\" and they did it with violence as much as with votes. Choosing to do this on purpose, instead of letting it happen slowly, tells them the federal government has no plans to stop them. At that point \"equal protection\" is a phrase in a document and not much else.", why:"Once the country decided quiet mattered more than equal rights, it took until the Voting Rights Act of 1965 to get the vote back for most Black Southerners." } }
        ]
      },

      "n_reconstruction_fails": {
        era:"watergate", year:"1896", chapter:"Separate but Equal",
        subtitle:"Homer Plessy sat in the whites-only car on purpose.",
        scenario:"In June 1892, Homer Plessy, who was one-eighth Black, bought a first-class train ticket in New Orleans and sat in the car that Louisiana law reserved for white passengers. He was arrested, which was the plan, since a New Orleans civil rights group had set it up as a test case. Now the Supreme Court has to decide whether \"separate but equal\" is constitutional. How should it rule?",
        advisors:{
          morris:{ key:"justice", gloss:"\"The equal protection of the laws\" does not come with an exception for train cars, and the Court should read those words the way they were ratified." },
          madison:{ key:"dueprocess", gloss:"Arresting a man for sitting in the wrong seat takes away his liberty for no reason except his race, and I do not see how that counts as due process of law." }
        },
        choices:[
          { short:"Reject \"separate but equal\"", label:"Strike segregation down now as a violation of the 14th Amendment.", cost:"It means a head-on fight with powerful state governments and with the public opinion of the time.", stability:12, flags:["earlybrown"], next:"n_brown",
            outcome:{ tag:"cf", text:"One justice actually voted this way. John Marshall Harlan, who had once been a slaveholder in Kentucky, wrote in his dissent that \"our constitution is color-blind, and neither knows nor tolerates classes among citizens.\" If four more justices had joined him, Jim Crow would have lost its legal cover before much of it was even written.", why:"Harlan lost 7 to 1 in 1896, and it took the Court until 1954 to think back to what he was arguing." } },
          { short:"Uphold \"separate but equal\"", label:"Uphold segregation as long as the facilities are \"equal.\"", cost:"You give Jim Crow the Constitution's approval for the next 58 years.", stability:-14, flags:["plessy"], next:"n_brown",
            outcome:{ tag:"real", text:"The Court ruled 7 to 1 against Plessy in May 1896. Justice Henry Billings Brown wrote for the majority that if Black citizens saw segregation as a mark of inferiority, it was only because the colored race \"chooses to put that construction upon it.\" Southern states took the ruling as permission, and segregated schools, hospitals, water fountains, and cemeteries followed.", why:"Plessy stayed the law for fifty-eight years, and for that whole time every segregation law could have the Supreme Court as its shield." } },
          { short:"Dodge the question", label:"Rule narrowly and avoid deciding whether segregation itself is legal.", cost:"Segregation spreads while the Court's back is turned.", stability:-6, flags:["dodge"], next:"n_brown",
            outcome:{ tag:"cf", text:"A narrow opinion sends Plessy's case back to the states without answering the question of legality. While the Court waits, the states pass segregation laws until they return to the Court, and the question is answered.", why:"Not deciding leaves the Louisiana law in place, so for the people on that train it would be as if they had lost." } }
        ]
      },

      /* ---------- CHAPTER 4 · 1954 · BROWN v. BOARD ---------- */
      "n_brown": {
        era:"watergate", year:"1954", chapter:"Brown v. Board",
        subtitle:"A third grade girl's walk to school has reached the Supreme Court.",
        scenario:"In Topeka, Kansas, Linda Brown had to walk across an entire rail yard to catch the bus to the all-Black school when there was a much closer white school; her father sued and her case was combined with several from South Carolina, Virginia, and Delaware. Thurgood Marshall of the NAACP is arguing that separate schools can never be equal. What should the Court rule?",
        advisors:{
          morris:{ key:"justice", gloss:"School is where most children first find themselves at the mercy of a government that may not treat them the same as everybody else, so \"establish Justice\" must be made there." },
          madison:{ key:"dueprocess", gloss:"Telling a child which school she must attend based on her race is the government restricting her liberty, and I don't see where the due process is." }
        },
        choices:[
          { short:"Strike down segregation", label:"Rule that \"separate but equal\" is unconstitutional in public schools.", cost:"There will be furious \"massive resistance,\" and some states will outright defy the Court for years.", stability:16, flags:["brown"], next:"end_arc",
            outcome:{ tag:"real", text:"On May 17, 1954, Chief Justice Earl Warren read a unanimous opinion that \"separate educational facilities are inherently unequal\" into record. Warren had worked hard to get all nine justices on board so the South couldn't say the Court was divided, but it actually took much longer to integrate the schools and in 1957 President Eisenhower had to send in the 101st Airborne to escort nine Black students into Central High School in Little Rock.", why:"Since Brown, no more segregation laws could use the Supreme Court as their shield, and that paved the way for the next ten years of the civil rights movement." } },
          { short:"Uphold Plessy", label:"Leave \"separate but equal\" in place and let the states and Congress handle it.", cost:"Segregation will continue unabated with the Court's blessing.", stability:-18, flags:["upholdseg"], next:"end_arc",
            outcome:{ tag:"cf", text:"If the Court had upheld Plessy, seventeen states' school segregation laws would be in force. The Montgomery bus boycott, the lunch counter sit-ins, and the Civil Rights Act of 1964 would all have fought the Supreme Court as well as the states. The words \"Equal Justice Under Law\" would have continued to be carved into the front entrance of the Court.", why:"Much of what the movement won in the 1960s was built on Brown, so losing it here probably sets back almost everything." } },
          { short:"Order it \"gradually\"", label:"Say segregation is wrong but let it end whenever the states say it does.", cost:"\"Someday\" becomes \"never\" in the eyes of the most stubborn.", stability:-4, flags:["deliberatespeed"], next:"end_arc",
            outcome:{ tag:"cf", text:"Real courts did something similar in 1955, telling schools to desegregate \"with all deliberate speed.\" A lot of school districts took that as a sign to wait. Prince Edward County, Virginia, took it to the point of closing its public schools from 1959 to 1964 so they wouldn't have to integrate them.", why:"Ten years after Brown, only about 2 percent of Black students in the South went to school with white students." } }
        ]
      },

      /* ---------- ENDINGS ---------- */
      "end_endures": { ending:true, kind:"tier", title:"A More Perfect Union",

const LS_KEY = "holdtheline_v2";   // schema changed for branching
const app = document.getElementById('app');
const presenterBtn = document.getElementById('presenterBtn');
const STORY = CONTENT.story;

const state = {
  i: 0,                 // index into STEPS (framing screens)
  presenter: false,
  arcHist: [],          // branching arc history: [{node, phase:'decide'|'reveal'}]
  arcPos: 0,            // pointer into arcHist
  ended: null,          // ending node id, once reached
  choices: {},          // choices[nodeId] = optionIndex  (arc nodes + today keys 't0','t1')
  votes: {},            // votes[nodeId] = [count per option] (presenter)
  preSolo: {}, postSolo: {}, preHands: {}, postHands: {}
};

/* ---- ordered framing steps; the whole branching arc lives in one 'arc' step ---- */
const STEPS = [
  {type:'title'}, {type:'prequiz'}, {type:'intro'},
  {type:'arc'},
  {type:'ending'},
  {type:'today', dec:0, phase:'decide'}, {type:'today', dec:0, phase:'reveal'},
  {type:'today', dec:1, phase:'decide'}, {type:'today', dec:1, phase:'reveal'},
  {type:'reportcard'}, {type:'action'}, {type:'postquiz'}, {type:'sources'}
];
function stepIndex(type){ return STEPS.findIndex(s=>s.type===type); }

/* ---- persistence (best-effort; game works without it) ---- */
function save(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify({
      presenter:state.presenter, choices:state.choices, votes:state.votes,
      preSolo:state.preSolo, postSolo:state.postSolo, preHands:state.preHands, postHands:state.postHands
    }));
  }catch(e){/* private mode / disabled storage — fine */}
}
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    const d = JSON.parse(raw);
    Object.assign(state, {
      presenter:!!d.presenter, choices:d.choices||{}, votes:d.votes||{},
      preSolo:d.preSolo||{}, postSolo:d.postSolo||{}, preHands:d.preHands||{}, postHands:d.postHands||{}
    });
  }catch(e){/* ignore */}
}

/* ---- small helpers ---- */
function esc(str){ return String(str).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const SRC = {
  morris:{ curse:"G. Morris · Convention, 1787", justice:"the Constitution's Preamble" },
  madison:{ majority:"Federalist 10", endofgov:"Federalist 51", property:"Madison · Convention, 1787", dueprocess:"Bill of Rights · 5th Amendment" }
};
function advisorCard(who, side, key, gloss){
  const q = QUOTES[who][key];
  const src = (SRC[who] && SRC[who][key]) || '';
  return `<div class="advisor ${who}">
    <div class="who"><span class="name">${side}</span></div>
    <blockquote>&quot;${esc(q)}&quot;</blockquote>
    <div class="gloss">${esc(gloss)}</div>
    ${src?`<div class="src">Source: ${esc(src)}</div>`:''}
  </div>`;
}
/* ---- branching helpers: nodes, votes, and the stability meter ---- */
function nodeById(id){ return STORY.nodes[id]; }
function chosenOpt(nodeId){
  if(state.presenter){ const t=topVoteNode(nodeId); return t? t.idx : undefined; }
  return state.choices[nodeId];
}
function getVotesNode(nodeId,n){ if(!state.votes[nodeId]) state.votes[nodeId]=Array(n).fill(0); return state.votes[nodeId]; }
function topVoteNode(nodeId){
  const v=state.votes[nodeId]; if(!v) return null;
  const total=v.reduce((a,b)=>a+b,0); if(total===0) return null;
  let mi=0; v.forEach((n,i)=>{ if(n>v[mi]) mi=i; });
  return {idx:mi, count:v[mi], total};
}
function committedRevealFrames(){ return state.arcHist.filter(f=>f.phase==='reveal'); }
function stabilityRaw(upto){
  const end = upto===undefined ? state.arcPos : upto;
  let s = STORY.startStability;
  for(let k=0;k<=end && k<state.arcHist.length;k++){
    const f=state.arcHist[k];
    if(f.phase==='reveal'){ const oi=chosenOpt(f.node); if(oi!=null){ s += (nodeById(f.node).choices[oi].stability||0); } }
  }
  return s;
}
function stabilityClamped(upto){ return Math.max(0, Math.min(100, stabilityRaw(upto))); }
function stabilityInfo(){
  const v=stabilityClamped();
  let label, color;
  if(v>=80){ label='Living up to it'; color='var(--good)'; }
  else if(v>=45){ label='Contested'; color='#b8860b'; }
  else if(v>=25){ label='Fragile'; color='var(--accent)'; }
  else if(v>=1){ label='Eroding'; color='var(--bad)'; }
  else { label='Betrayed'; color='var(--bad)'; }
  return {v,label,color};
}
function stabilityBar(){
  const {v,label,color}=stabilityInfo();
  return `<div class="stability"><div class="top"><span class="label">The Promise of Equality: ${label}</span><span>${v}/100</span></div>`
    + `<div class="track"><div class="fill" style="width:${v}%;background:${color};"></div></div></div>`;
}

function quizScreen(phase){
  const isPost = phase==='post';
  const heading = isPost ? "Post-Quiz" : "Pre-Quiz";
  const sub = isPost ? "These are the same three questions as before, so you can see what changed." : "Answer three quick questions before we start, and just give your best guess.";
  let body = `<div class="screen"><div class="eyebrow">${heading}</div><h2>${sub}</h2>`;

  CONTENT.quiz.forEach((q,qi)=>{
    body += `<div class="card q"><div class="qtext">${qi+1}. ${esc(q.q)}</div>`;
    if(state.presenter){
      // presenter: enter count of correct hands (or hands per option)
      const hands = (isPost?state.postHands:state.preHands)[q.id] || q.options.map(()=>0);
      body += `<p class="muted" style="font-size:.85rem;">Enter a show of hands for each answer, then reveal.</p>`;
      q.options.forEach((opt,oi)=>{
        const correct = oi===q.answer;
        body += `<div class="voterow">
          <span class="letter" style="flex:none;">${String.fromCharCode(65+oi)}</span>
          <span class="ctext">${esc(opt)} ${correct?'<span class="badge up" style="font-size:.65rem;">correct</span>':''}</span>
          <span class="stepper">
            <button data-action="quiz-dec" data-phase="${phase}" data-q="${q.id}" data-opt="${oi}">&minus;</button>
            <span class="count">${hands[oi]||0}</span>
            <button data-action="quiz-inc" data-phase="${phase}" data-q="${q.id}" data-opt="${oi}">+</button>
          </span>
        </div>`;
      });
    } else {
      const picked = (isPost?state.postSolo:state.preSolo)[q.id];
      q.options.forEach((opt,oi)=>{
        const cls = picked===oi ? 'opt picked' : 'opt';
        body += `<div class="${cls}" data-action="quiz-pick" data-phase="${phase}" data-q="${q.id}" data-opt="${oi}">
          <span class="letter">${String.fromCharCode(65+oi)}</span><span>${esc(opt)}</span></div>`;
      });
    }
    body += `</div>`;
  });

  // score preview on post-quiz
  if(isPost){
    body += scoreSummaryBlock();
  }

  const answered = quizAnswered(phase);
  const nextLabel = isPost ? "See sources" : "Continue";
  body += `<div class="btnrow">
      <button class="btn secondary" data-action="back">Back</button>
      <span class="spacer"></span>
      <button class="btn" data-action="next" ${answered?'':'disabled'}>${nextLabel} &rarr;</button>
    </div>`;
  if(!answered){
    body += `<p class="hint">${state.presenter?'Enter at least one hand count to continue.':'Answer all three to continue.'}</p>`;
  }
  body += `</div>`;
  return body;
}

function quizAnswered(phase){
  if(state.presenter){
    const src = phase==='post'?state.postHands:state.preHands;
    return CONTENT.quiz.some(q => (src[q.id]||[]).some(n=>n>0));
  } else {
    const src = phase==='post'?state.postSolo:state.preSolo;
    return CONTENT.quiz.every(q => src[q.id]!==undefined);
  }
}

function scrArc(){
  if(!state.arcHist.length) enterArc();
  const f = state.arcHist[state.arcPos];
  return f.phase==='reveal' ? scrArcReveal(f.node) : scrArcDecide(f.node);
}
function scrArcDecide(nodeId){
  const n = nodeById(nodeId);
  let body = `<div class="screen">${stabilityBar()}
    <div class="eyebrow">${esc(n.year)} · ${esc(n.chapter)}</div>
    <h2>${esc(n.subtitle)}</h2>
    <div class="card"><p class="lede" style="color:var(--ink);">${esc(n.scenario)}</p></div>
    <div class="advisors">
      ${advisorCard('morris','Gouverneur Morris', n.advisors.morris.key, n.advisors.morris.gloss)}
      ${advisorCard('madison','James Madison', n.advisors.madison.key, n.advisors.madison.gloss)}
    </div>
    <h3>Your move:</h3>`;

function scoreSummaryBlock(){
  if(state.presenter){
    const pre = handsPct('pre'), post = handsPct('post');

    const d = post.pct - pre.pct;
    return `<div class="card center" style="background:var(--parchment-2);">
      <h3>Class results</h3>
      <div class="scorewrap">
        <div><div class="scorebig">${pre.pct}%</div><div class="muted">before</div></div>
        <div class="arrow">&rarr;</div>
        <div><div class="scorebig">${post.pct}%</div><div class="muted">after</div></div>
      </div>
      <p class="delta ${d>=0?'pos':'neg'}">${d>=0?'+':''}${d} points</p>
      <p class="muted" style="font-size:.85rem;">This is the percent of hands that picked the correct answer across all three questions.</p>
    </div>`;
  } else {
    const pre = soloScore('pre'), post = soloScore('post');
    const d = post - pre;
    return `<div class="card center" style="background:var(--parchment-2);">
      <h3>Your results</h3>
      <div class="scorewrap">
        <div><div class="scorebig">${pre}/3</div><div class="muted">before</div></div>

function soloScore(phase){
  const src = phase==='post'?state.postSolo:state.preSolo;
  return CONTENT.quiz.reduce((n,q)=> n + (src[q.id]===q.answer?1:0), 0);
}
function handsPct(phase){
  const src = phase==='post'?state.postHands:state.preHands;
  let correct=0,total=0;
  CONTENT.quiz.forEach(q=>{
    const h = src[q.id]||[];
    h.forEach((n,oi)=>{ total+=n; if(oi===q.answer) correct+=n; });
  });
  return {correct,total,pct: total? Math.round(correct/total*100):0};
}

/* ---- branching arc navigation ---- */
function enterArc(){
  if(!state.arcHist.length){ state.arcHist=[{node:STORY.start, phase:'decide'}]; state.arcPos=0; state.ended=null; }
}
function resolveTier(){
  const s = stabilityRaw();
  if(s <= (STORY.collapseAt||0)) return 'end_collapse';
  for(const t of STORY.tiers){ if(s>=t.min) return t.id; }
  return STORY.tiers[STORY.tiers.length-1].id;
}
function arcAdvance(){
  const f = state.arcHist[state.arcPos];
  if(f.phase==='decide'){
    if(chosenOpt(f.node)==null) return;                 // must choose first
    state.arcHist = state.arcHist.slice(0, state.arcPos+1);
    state.arcHist.push({node:f.node, phase:'reveal'});
    state.arcPos++; save(); render(); return;
  }
  // reveal -> resolve where the story goes next
  const n = nodeById(f.node);
  const c = n.choices[chosenOpt(f.node)];
  let nextId = c.next;
  if(stabilityRaw() <= (STORY.collapseAt||0)) nextId = 'end_collapse';
  else if(nextId==='end_arc') nextId = resolveTier();
  const nx = nodeById(nextId);
  if(nx && nx.ending){ state.ended = nextId; state.i = stepIndex('ending'); save(); render(); return; }
  state.arcHist = state.arcHist.slice(0, state.arcPos+1);
  state.arcHist.push({node:nextId, phase:'decide'});
  state.arcPos++; save(); render();
}
function restart(){ state.i=0; state.arcHist=[]; state.arcPos=0; state.ended=null; save(); render(); }

/* ---------------------- ERA THEMING ---------------------- */
/* Maps the current step to a period-accurate visual era. Only re-points
   the <body data-era> attribute; the CSS above does the rest. */
function eraForStep(step){
  if(step.type==='arc'){ const f=state.arcHist[state.arcPos]; return (f && nodeById(f.node).era) || 'founding'; }
  if(step.type==='ending'){ return (state.ended && nodeById(state.ended).era) || 'today'; }
  if(step.type==='today') return 'today';
  switch(step.type){
    case 'title': case 'prequiz': case 'intro': return 'founding';
    default: return 'today';
  }
}

/* ---------------------- ROUTER ---------------------- */
function render(){
  const step = STEPS[state.i];
  document.body.setAttribute('data-era', eraForStep(step));
  let html='';
  switch(step.type){
    case 'title': html=scrTitle(); break;
    case 'prequiz': html=quizScreen('pre'); break;
    case 'intro': html=scrIntro(); break;
    case 'arc': html=scrArc(); break;
    case 'ending': html=scrEnding(); break;
    case 'today': html=scrToday(step); break;
    case 'reportcard': html=scrReport(); break;
    case 'action': html=scrAction(); break;
    case 'postquiz': html=quizScreen('post'); break;
    case 'sources': html=scrSources(); break;
  }
  app.innerHTML = html;
  window.scrollTo({top:0,behavior:'auto'});
}

function next(){
  const step = STEPS[state.i];
  if(step.type==='intro'){ state.i++; enterArc(); save(); render(); return; }
  if(step.type==='arc'){ arcAdvance(); return; }
  if(step.type==='ending'){ state.i = stepIndex('today'); save(); render(); return; }
  if(state.i < STEPS.length-1){ state.i++; save(); render(); }
}
function back(){
  const step = STEPS[state.i];
  if(step.type==='arc'){
    if(state.arcPos>0){ state.arcPos--; } else { state.i = stepIndex('intro'); }
    save(); render(); return;
  }
  if(step.type==='ending'){ state.i = stepIndex('arc'); save(); render(); return; }
  if(state.i > 0){ state.i--; save(); render(); }
}

/* ---------------------- ACTIONS ---------------------- */
function nodeCount(key){ return key[0]==='t' ? CONTENT.today.decisions[+key.slice(1)].choices.length : nodeById(key).choices.length; }
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  const {node,opt,phase,q} = el.dataset;
  switch(a){
    case 'next': next(); break;
    case 'back': back(); break;
    case 'restart': restart(); break;
    case 'toggle-presenter': setPresenter(!state.presenter); break;
    case 'choose':
      state.choices[node]=+opt;
      if(STEPS[state.i].type==='arc'){ state.arcHist = state.arcHist.slice(0, state.arcPos+1); }
      save(); render(); break;
    case 'vote-inc': { const v=getVotesNode(node, nodeCount(node)); v[+opt]++; if(STEPS[state.i].type==='arc'){ state.arcHist=state.arcHist.slice(0,state.arcPos+1); } save(); render(); break; }
    case 'vote-dec': { const v=getVotesNode(node, nodeCount(node)); v[+opt]=Math.max(0,v[+opt]-1); if(STEPS[state.i].type==='arc'){ state.arcHist=state.arcHist.slice(0,state.arcPos+1); } save(); render(); break; }
    case 'quiz-pick': { (phase==='post'?state.postSolo:state.preSolo)[q]=+opt; save(); render(); break; }
    case 'quiz-inc': { quizHand(phase,q,+opt,+1); save(); render(); break; }
    case 'quiz-dec': { quizHand(phase,q,+opt,-1); save(); render(); break; }
    case 'export-json': exportJSON(); break;
    case 'export-csv': exportCSV(); break;
  }
});

function quizHand(phase,qid,opt,delta){
  const store = phase==='post'?state.postHands:state.preHands;
  const q = CONTENT.quiz.find(x=>x.id===qid);
  if(!store[qid]) store[qid]=Array(q.options.length).fill(0);
  store[qid][opt]=Math.max(0, store[qid][opt]+delta);
}

/* ---------------------- KEYBOARD ---------------------- */
function decideInfo(step){
  if(step.type==='arc'){ const f=state.arcHist[state.arcPos]; if(!f || f.phase!=='decide') return null; return {key:f.node, count:nodeById(f.node).choices.length}; }
  if(step.type==='today' && step.phase==='decide'){ return {key:'t'+step.dec, count:CONTENT.today.decisions[step.dec].choices.length}; }
  return null;
}
document.addEventListener('keydown', e=>{
  if(e.target.matches('input,textarea')) return;
  const step = STEPS[state.i];
  if(e.key==='p'||e.key==='P'){ setPresenter(!state.presenter); return; }
  if(e.key==='ArrowRight'){ tryNext(); return; }
  if(e.key==='ArrowLeft'){ back(); return; }
  if(e.key==='Enter'||e.key===' '){
    if(!decideInfo(step) || state.presenter){ tryNext(); e.preventDefault(); }
    return;
  }
  const info = decideInfo(step);
  if(info && /^[1-9]$/.test(e.key)){
    const oi = +e.key-1; if(oi>=info.count) return;
    if(state.presenter){ const v=getVotesNode(info.key,info.count); v[oi]++; }
    else { state.choices[info.key]=oi; }
    if(step.type==='arc'){ state.arcHist = state.arcHist.slice(0, state.arcPos+1); }
    save(); render();
  }
});
function tryNext(){
  const step = STEPS[state.i];
  const info = decideInfo(step);
  if(info && !state.presenter && state.choices[info.key]==null) return;
  if(step.type==='prequiz'||step.type==='postquiz'){ if(!quizAnswered(step.type==='postquiz'?'post':'pre')) return; }
  next();
}

/* ---------------------- PRESENTER TOGGLE ---------------------- */
function setPresenter(on){
  state.presenter=on;
  document.body.classList.toggle('presenter',on);
  presenterBtn.textContent = 'Presenter mode: '+(on?'On':'Off');
  presenterBtn.classList.toggle('on',on);
  save(); render();
}

/* ---------------------- EXPORT ---------------------- */
function buildSummary(){
  const path = committedRevealFrames().map(f=>{
    const n=nodeById(f.node); const oi=chosenOpt(f.node); const c=n.choices[oi];
    return { node:f.node, year:n.year, chapter:n.chapter, chose:c.short, tag:c.outcome.tag, stability:c.stability||0 };
  });
  const today = CONTENT.today.decisions.map((d,di)=>{
    const key='t'+di; const p = state.presenter ? ((topVoteNode(key)||{}).idx) : state.choices[key];
    return { prompt:d.scenario.slice(0,70), chose: p!=null? d.choices[p].short : null };
  });
  const quiz = {
    solo: { pre: soloScore('pre'), post: soloScore('post'), outOf: CONTENT.quiz.length },
    presenter: { pre: handsPct('pre'), post: handsPct('post') }
  };
  return { title:CONTENT.meta.title, exportedAt:new Date().toISOString(), mode: state.presenter?'presenter':'solo',
    finalStability: stabilityClamped(), ending: state.ended? nodeById(state.ended).title : null, path, today, quiz };
}
function download(filename, text, type){
  const blob = new Blob([text], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename; document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
function stamp(){ return new Date().toISOString().slice(0,16).replace(/[:T]/g,'-'); }
function exportJSON(){
  download(`hold-the-line-results-${stamp()}.json`, JSON.stringify(buildSummary(),null,2), 'application/json');
}
function csvCell(s){ return '"'+String(s).replace(/"/g,'""')+'"'; }
function exportCSV(){
  const S = buildSummary(); const rows=[];
  rows.push(['Section','Moment','Chose','Type','Stability'].map(csvCell).join(','));
  S.path.forEach(p=> rows.push(['Arc', `${p.year} ${p.chapter}`, p.chose, p.tag==='real'?'real history':'counterfactual', p.stability].map(csvCell).join(',')));
  S.today.forEach((t,i)=> rows.push(['Today', `Today ${i+1}`, t.chose||'', '', ''].map(csvCell).join(',')));
  rows.push(['Summary','Final national stability', S.finalStability, 'ending', S.ending||''].map(csvCell).join(','));
  rows.push('');
  rows.push(['Section','Question','Phase','Answer','Correct?','Hands/Picked'].map(csvCell).join(','));
  CONTENT.quiz.forEach(q=>{
    ['pre','post'].forEach(phase=>{
      q.options.forEach((opt,oi)=>{
        let val='';
        if(state.presenter){ val = ((phase==='post'?state.postHands:state.preHands)[q.id]||[])[oi]||0; }
        else { val = ((phase==='post'?state.postSolo:state.preSolo)[q.id]===oi)?'picked':''; }
        rows.push(['Quiz', q.q, phase, opt, (oi===q.answer?'YES':''), val].map(csvCell).join(','));
      });
    });
  });
  if(state.presenter){ const pre=handsPct('pre'),post=handsPct('post'); rows.push(''); rows.push(['Summary','Class % correct','pre',pre.pct+'%','post',post.pct+'%'].map(csvCell).join(',')); }
  else { rows.push(''); rows.push(['Summary','Solo score','pre',soloScore('pre')+'/3','post',soloScore('post')+'/3'].map(csvCell).join(',')); }
  download(`hold-the-line-results-${stamp()}.csv`, rows.join('\n'), 'text/csv');
}

/* ---------------------- BOOT ---------------------- */
load();
document.body.classList.toggle('presenter', state.presenter);
presenterBtn.textContent = 'Presenter mode: '+(state.presenter?'On':'Off');
presenterBtn.classList.toggle('on', state.presenter);
render();
</script>
